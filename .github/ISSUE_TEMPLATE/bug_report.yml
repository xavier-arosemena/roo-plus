name: Bug Report
description: Report a problem with Roo+ so we can fix it
labels: ["bug"]
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/xavier-arosemena/roo-plus/issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe the problem in plain language and what you expected to happen instead.
      placeholder: 'Example: "The task never starts and no message appears. I expected it to run."'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Start with your environment (OS, Roo+ version, API provider/model).
      placeholder: |
        1. Environment (OS, Roo+ version, provider/model)
        2. Exact actions (clicks, inputs, commands)
        3. What you observed after each step
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Roo+ version
      description: e.g., v3.3.1 (see the extension details page)
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: API provider
      options:
        - Anthropic
        - Amazon Bedrock
        - Chutes AI
        - DeepSeek
        - Featherless AI
        - Fireworks AI
        - Google Gemini
        - Google Vertex AI
        - Groq
        - LiteLLM
        - LM Studio
        - Mistral AI
        - Ollama
        - OpenAI
        - OpenAI Compatible
        - OpenRouter
        - Requesty
        - SambaNova
        - Unbound
        - VS Code Language Model API
        - xAI (Grok)
        - Not Applicable / Other

  - type: input
    id: model
    attributes:
      label: Model (optional)
      placeholder: e.g., Claude 3.7 Sonnet

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors (optional)
      description: Paste relevant output. Use triple backticks (```) for formatting.
      render: shell
