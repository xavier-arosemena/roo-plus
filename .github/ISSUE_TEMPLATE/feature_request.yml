name: Feature Request
description: Suggest a new feature or improvement for Roo+
labels: ["enhancement"]
title: "[FEATURE] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please search [existing issues and discussions](https://github.com/xavier-arosemena/roo-plus/issues) first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what can't you do today?
      placeholder: 'Example: "I often start a run by mistake and there is no way to undo it."'
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: Describe what you'd like to happen in simple terms.
      placeholder: 'Example: "Ask for confirmation before starting a run."'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any workarounds or other approaches you've tried.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and discussions for duplicates
          required: true
