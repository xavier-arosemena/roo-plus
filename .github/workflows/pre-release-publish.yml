name: Publish Pre-release Version

# Publishes the "pre-release" channel consumed via the marketplace's
# "Install Pre-Release Version" option (VS Code Marketplace and Open VSX).
# Every push to master produces a fresh pre-release build that outranks the
# latest stable, letting testers run the newest code before it ships as a
# stable release (previously named "Publish Pre-release Extension" /
# nightly-publish.yml).
#
# VERSIONING (iterate-then-stabilize, same minor): the committed version in
# src/package.json IS the published version — there is NO build-time derivation
# or mutation of the version number. Pre-releases are committed consecutive
# patches on the current minor (3.86.19, 3.86.20, ...); the stable is the next
# patch on that same minor; the next cycle starts a new minor. The Open VSX API
# query below is a pure GUARD (duplicate + monotonicity), not a derivation. The
# Microsoft.VisualStudio.Code.PreRelease marker is stamped EPHEMERALLY around
# packaging so the committed tree stays clean (only the marker field is added,
# never the version). See docs/adr/adr-release-versioning-policy.md.

on:
  push:
    branches: [master]
  workflow_dispatch: # Allows manual triggering.

permissions:
  contents: read

concurrency:
  group: marketplace-prerelease
  cancel-in-progress: false

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace-prerelease
    # Expose the marketplace tokens as job-level env so steps can gate on them
    # with `if: env.* != ''` — GitHub Actions does NOT allow the `secrets`
    # context inside `if:` expressions (workflow parse error otherwise).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Optional Slack failure notification. Exposed as job-level env so steps can
      # gate on it with `if: env.* != ''` — the `secrets` context is not allowed
      # inside `if:` expressions (workflow parse error otherwise).
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The VSIX embeds modes regenerated from the custom-modes submodule at
          # build time, so CI MUST check it out at the recorded pin — otherwise the
          # build would silently reuse stale committed artifacts.
          submodules: recursive

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Prepare extension publish
        uses: ./.github/actions/prepare-extension
        with:
          log-prefix: PRERELEASE
          environment: marketplace-prerelease
          require-master-ref: "true"
          validate-tokens: "true"
          vsce-pat: ${{ secrets.VSCE_PAT }}
          ovsx-pat: ${{ secrets.OVSX_PAT }}

      - name: Skip if this push is a release merge
        id: release-check
        run: |
          echo "::group::[CI:PRERELEASE:RELEASE-CHECK] Checking whether this push is a release merge"
          skip=false
          # Matches both "chore: prepare vX.Y.Z release" and "chore: prepare vX.Y.Z stable release",
          # but NOT "chore: prepare vX.Y.Z pre-release" (those SHOULD publish).
          release_re='^chore: prepare v[0-9]+\.[0-9]+\.[0-9]+( stable)? release'

          # Direct push of a release-prep commit (e.g. cutting a stable).
          commit_subject=$(git log -1 --format=%s)
          if echo "$commit_subject" | grep -qE "$release_re"; then
            echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] Commit '${commit_subject}' is a release-prep; skipping pre-release publish."
            skip=true
          fi

          # Merge that brought in a release-prep commit (e.g. "Merge pull request #N from .../release/vX.Y.Z").
          # The pre-release workflow triggers on the merge push; without this, merging a stable-prep branch
          # would publish the committed STABLE patch as a pre-release and hijack Open VSX
          # 'latest' ahead of the stable release it was prepared for.
          if [ "$skip" = "false" ] && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            merged_subject=$(git log HEAD^2 -1 --format=%s)
            if echo "$merged_subject" | grep -qE "$release_re"; then
              echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] Merge brought in release-prep '${merged_subject}'; skipping pre-release publish."
              skip=true
            fi
          fi

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] skip=${skip}"
          echo "::endgroup::"

      - name: Fail fast when no marketplace token is configured
        # A "successful" run that publishes nothing is a silent failure. Fail
        # loudly when neither registry token is set so the run turns red and
        # triggers notifications instead of quietly skipping both publishes.
        if: steps.release-check.outputs.skip != 'true' && env.VSCE_PAT == '' && env.OVSX_PAT == ''
        run: |
          echo "::group::[CI:PRERELEASE:TOKEN-GUARD] Checking marketplace tokens"
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD] Neither VSCE_PAT nor OVSX_PAT is configured in the marketplace-prerelease environment — the pre-release cannot be published to any registry."
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD] Add a token at: Settings → Environments → marketplace-prerelease → Add secret, then re-run this workflow."
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD]   VSCE_PAT: VS Code Marketplace PAT (Manage scope, publisher 'xavier-arosemena')"
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD]   OVSX_PAT: https://open-vsx.org/user-settings/tokens (publisher 'xavier-arosemena')"
          echo "::endgroup::"
          exit 1

      - name: Verify announcement data for the committed version
        # Release-readiness gate for the "What's New" popup (bug #265), run as a
        # fast-fail on the COMMITTED checkout. Under the iterate-then-stabilize
        # policy the committed version IS the published version (no build-time
        # mutation), and verify-announcement-version.mjs resolves ANY patch to its
        # line base <major>.<minor>.0 — so a pre-release patch like 3.86.19
        # verifies against the `## [3.86.0]` changelog section and the asset keyed
        # 3.86.0. This is redundant with the prevsix/prebundle/prevscode:prepublish
        # hooks (which also run on the packaging path) but kept as an explicit
        # fast-fail so the build stops loudly before spending minutes on packaging
        # if the line base has no announcement content.
        if: steps.release-check.outputs.skip != 'true'
        run: |
          echo "::group::[CI:PRERELEASE:ANNOUNCEMENT] Verifying announcement data for the committed version"
          node scripts/verify-announcement-version.mjs
          echo "::notice::[CI:PRERELEASE:ANNOUNCEMENT] announcement data verified for the committed version"
          echo "::endgroup::"

      - name: Guard committed version is unique and monotonic on its minor line
        # iterate-then-stabilize GUARD (not a derivation). The version is never
        # derived or mutated in CI — the committed src/package.json version IS the
        # published version. This step queries the Open VSX API (15s timeout) and
        # FAILS if:
        #   (a) the committed version is already published — a duplicate the
        #       --skip-duplicate flags would otherwise silently swallow; or
        #   (b) the committed version is not GREATER than the max published patch
        #       on the same <major>.<minor> line — each pre-release must be higher
        #       than the last published (e.g. the 3.86 line is published through
        #       3.86.18, so the next committed pre-release must be 3.86.19 or
        #       higher; bump with `pnpm bump:pre-release`).
        # No `github.run_number` involvement — this is a guard, not a derivation.
        if: steps.release-check.outputs.skip != 'true'
        run: |
          echo "::group::[CI:PRERELEASE:GUARD] Verifying the committed version is unique and monotonic"
          # Run as ESM (--input-type=module) so top-level `await` and `import`
          # coexist; a CJS stdin script with both require() and top-level await
          # throws ERR_AMBIGUOUS_MODULE_SYNTAX.
          node --input-type=module <<'EOF'
          import fs from "node:fs"
          import https from "node:https"
          const pkg = JSON.parse(fs.readFileSync("src/package.json", "utf8"))
          const version = pkg.version
          const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(version)
          if (!m) {
            console.log(`::error::[CI:PRERELEASE:GUARD] committed version "${version}" is not a plain major.minor.patch`)
            process.exit(1)
          }
          const major = Number(m[1])
          const minor = Number(m[2])
          const patch = Number(m[3])

          function fetchOpenVsxVersions() {
            return new Promise((resolve, reject) => {
              const req = https.get(
                "https://open-vsx.org/api/xavier-arosemena/roo-plus",
                { timeout: 15000 },
                (res) => {
                  if (res.statusCode !== 200) {
                    res.resume()
                    reject(new Error(`Open VSX API returned HTTP ${res.statusCode}`))
                    return
                  }
                  let body = ""
                  res.setEncoding("utf8")
                  res.on("data", (chunk) => { body += chunk })
                  res.on("end", () => {
                    try {
                      const data = JSON.parse(body)
                      resolve(Object.keys(data.allVersions || {}))
                    } catch (err) {
                      reject(err)
                    }
                  })
                }
              )
              req.on("timeout", () => { req.destroy(new Error("Open VSX API request timed out")) })
              req.on("error", reject)
            })
          }

          let published
          try {
            published = await fetchOpenVsxVersions()
          } catch (err) {
            console.log(`::error::[CI:PRERELEASE:GUARD] could not query Open VSX to guard against duplicate/out-of-order publishes (${err.message}); aborting to avoid a silent skip or a non-monotonic publish`)
            process.exit(1)
          }

          if (published.includes(version)) {
            console.log(`::error::[CI:PRERELEASE:GUARD] ${version} is ALREADY published to Open VSX — bump src/package.json to the next pre-release patch on the ${major}.${minor} line (pnpm bump:pre-release)`)
            process.exit(1)
          }

          const lineRe = new RegExp("^" + major + "\\." + minor + "\\.(\\d+)$")
          let maxPatch = -1
          for (const v of published) {
            const pm = v.match(lineRe)
            if (pm) maxPatch = Math.max(maxPatch, Number(pm[1]))
          }
          console.log(`[CI:PRERELEASE:GUARD] max published patch on ${major}.${minor}.x: ${maxPatch < 0 ? "none" : maxPatch}`)
          if (patch <= maxPatch) {
            console.log(`::error::[CI:PRERELEASE:GUARD] committed ${version} is not greater than the max published ${major}.${minor}.${Math.max(maxPatch, 0)} on the ${major}.${minor} line — each pre-release must be higher than the last published; bump to the next patch (pnpm bump:pre-release)`)
            process.exit(1)
          }
          console.log(`::notice::[CI:PRERELEASE:GUARD] ${version} is unique and monotonic on the ${major}.${minor} line — proceeding`)
          EOF
          echo "::endgroup::"

      - name: Build workspace packages
        if: steps.release-check.outputs.skip != 'true'
        env:
          PKG_RELEASE_CHANNEL: prerelease
        run: |
          echo "::group::[CI:PRERELEASE:BUILD] Building workspace packages"
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build
          echo "::notice::[CI:PRERELEASE:BUILD] workspace packages built"
          echo "::endgroup::"

      - name: Package pre-release VSIX
        if: steps.release-check.outputs.skip != 'true'
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PKG_RELEASE_CHANNEL: prerelease
        run: |
          echo "::group::[CI:PRERELEASE:PACKAGE] Packaging pre-release VSIX"
          # Ephemeral Open VSX pre-release marker. `vsce package --pre-release`
          # writes Microsoft.VisualStudio.Code.PreRelease to the XML
          # extension.vsixmanifest (what the VS Code Marketplace reads), but the
          # ovsx CLI drops --pre-release for a pre-built .vsix and Open VSX reads
          # the marker from extension/package.json inside the VSIX (bug #243).
          # Stamp it around packaging ONLY, then restore the backup immediately
          # (via the EXIT trap) — the VERSION is never touched and the committed
          # tree stays clean.
          cp src/package.json /tmp/roo-plus-src-package.json.bak
          trap 'mv /tmp/roo-plus-src-package.json.bak src/package.json' EXIT
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src/package.json','utf8')); p['Microsoft.VisualStudio.Code.PreRelease']=true; fs.writeFileSync('src/package.json', JSON.stringify(p,null,'\t')+'\n')"
          mkdir -p bin
          pnpm --filter ./src exec vsce package --pre-release --no-dependencies --out ../bin
          echo "::notice::[CI:PRERELEASE:PACKAGE] pre-release VSIX packaged"
          echo "::endgroup::"

      - name: Verify VSIX contents
        if: steps.release-check.outputs.skip != 'true'
        run: |
          echo "::group::[CI:PRERELEASE:VERIFY-VSIX] Verifying VSIX contents"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"
          test -f "$vsix_path"
          unzip -l "$vsix_path" > /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-plus-vsix-contents.txt
          echo "::notice::[CI:PRERELEASE:VERIFY-VSIX] VSIX contents verified"
          echo "::endgroup::"

      - name: Validate packaged manifest identity
        if: steps.release-check.outputs.skip != 'true'
        run: |
          echo "::group::[CI:PRERELEASE:MANIFEST] Validating packaged manifest identity"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')
          artifact_prerelease=$(unzip -p "$vsix_path" extension/package.json | jq -r '."Microsoft.VisualStudio.Code.PreRelease" // empty')

          test "$artifact_name" = "roo-plus"
          test "$artifact_publisher" = "xavier-arosemena"
          # Open VSX reads this marker from extension/package.json to flag the
          # version as a pre-release (the ovsx CLI ignores --pre-release for a
          # pre-built .vsix). Fail loudly if it is missing so a regression can
          # never publish a "pre-release" as a stable version again (bug #243).
          test "$artifact_prerelease" = "true"
          echo "::notice::[CI:PRERELEASE:MANIFEST] packaged manifest identity OK: $artifact_name / $artifact_publisher (pre-release marker: $artifact_prerelease)"
          echo "::endgroup::"

      - name: Publish pre-release to VS Code Marketplace
        if: steps.release-check.outputs.skip != 'true' && env.VSCE_PAT != ''
        run: |
          echo "::group::[CI:PRERELEASE:PUBLISH:VSCE] Publishing pre-release to VS Code Marketplace"
          package_version=$(node -p "require('./src/package.json').version")
          npx @vscode/vsce publish --pre-release --skip-duplicate --packagePath "bin/roo-plus-${package_version}.vsix"
          echo "::notice::[CI:PRERELEASE:PUBLISH:VSCE] Published or skipped existing xavier-arosemena.roo-plus ${package_version} as a VS Code Marketplace pre-release"
          echo "::endgroup::"

      # `ovsx publish` ignores --pre-release for an already-packaged .vsix (it only
      # applies when ovsx does the packaging itself), so the pre-release marker must
      # already be embedded in the VSIX. `vsce package --pre-release` writes
      # Microsoft.VisualStudio.Code.PreRelease to the XML extension.vsixmanifest
      # (what the VS Code Marketplace reads); the "Package pre-release VSIX" step
      # also stamps it into extension/package.json around packaging (EPHEMERALLY —
      # the committed tree is restored immediately), which is what Open VSX reads
      # to flag the version as a pre-release (see bug #243). The "Validate packaged
      # manifest identity" step asserts both are present before we get here.
      #
      # Open VSX's "latest" alias resolves to the highest semver across stable and
      # pre-release alike (pre-release only breaks ties at equal major.minor.patch),
      # so a pre-release build can transiently become "latest" until the next stable
      # outranks it. Under iterate-then-stabilize the stable is the NEXT PATCH on
      # the same minor (e.g. 3.88.3 outranks pre-releases 3.88.1/3.88.2) and the
      # next cycle starts a new minor, so the next stable always outranks the
      # pre-releases on its line. This is transient per release cycle and mirrors
      # how Marketplace pre-release users track the newest published version — an
      # accepted trade-off.
      - name: Publish pre-release to Open VSX Registry
        if: steps.release-check.outputs.skip != 'true' && env.OVSX_PAT != ''
        run: |
          echo "::group::[CI:PRERELEASE:PUBLISH:OVSX] Publishing pre-release to Open VSX Registry"
          package_version=$(node -p "require('./src/package.json').version")
          set -o pipefail
          publish_output=$(pnpm exec ovsx publish "bin/roo-plus-${package_version}.vsix" --skip-duplicate 2>&1 | tee /dev/stderr)
          if echo "$publish_output" | grep -q "is already published"; then
            echo "::notice::[CI:PRERELEASE:PUBLISH:OVSX] xavier-arosemena.roo-plus ${package_version} was already published to Open VSX; skipped."
          else
            echo "::notice::[CI:PRERELEASE:PUBLISH:OVSX] Published xavier-arosemena.roo-plus ${package_version} as an Open VSX pre-release"
          fi
          echo "::endgroup::"

      - name: Upload pre-release VSIX artifact
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roo-plus-prerelease-${{ github.sha }}
          path: bin/roo-plus-*.vsix
          retention-days: 7

      # Failure notification. Runs only when a previous step failed AND a Slack
      # webhook is configured; continue-on-error so a notification problem can
      # never mask the underlying failure.
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}
          workflow-name: "Publish Pre-release Version"
          # Single-job workflow with no `needs`, so `toJson(needs)` would be `{}`.
          # This step only runs when the job already failed (`failure()`), so a
          # static object naming the current job is the correct input here.
          failed-jobs: '{"publish-prerelease":{"result":"failure"}}'
