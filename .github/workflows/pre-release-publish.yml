name: Publish Pre-release Version

# Publishes the "pre-release" channel consumed via the marketplace's
# "Install Pre-Release Version" option (VS Code Marketplace and Open VSX).
# Every push to master produces a fresh pre-release build that outranks the
# latest stable, letting testers run the newest code before it ships as a
# stable release (previously named "Publish Pre-release Extension" /
# nightly-publish.yml).

on:
  push:
    branches: [master]
  workflow_dispatch: # Allows manual triggering.

permissions:
  contents: read

concurrency:
  group: marketplace-prerelease
  cancel-in-progress: false

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace-prerelease
    # Expose the marketplace tokens as job-level env so steps can gate on them
    # with `if: env.* != ''` — GitHub Actions does NOT allow the `secrets`
    # context inside `if:` expressions (workflow parse error otherwise).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Optional Slack failure notification. Exposed as job-level env so steps can
      # gate on it with `if: env.* != ''` — the `secrets` context is not allowed
      # inside `if:` expressions (workflow parse error otherwise).
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The VSIX embeds modes regenerated from the custom-modes submodule at
          # build time, so CI MUST check it out at the recorded pin — otherwise the
          # build would silently reuse stale committed artifacts.
          submodules: recursive

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Prepare extension publish
        uses: ./.github/actions/prepare-extension
        with:
          log-prefix: PRERELEASE
          environment: marketplace-prerelease
          require-master-ref: "true"
          validate-tokens: "true"
          vsce-pat: ${{ secrets.VSCE_PAT }}
          ovsx-pat: ${{ secrets.OVSX_PAT }}

      - name: Skip if this push is a release merge
        id: release-check
        run: |
          echo "::group::[CI:PRERELEASE:RELEASE-CHECK] Checking whether this push is a release merge"
          skip=false
          # Matches both "chore: prepare vX.Y.Z release" and "chore: prepare vX.Y.Z stable release",
          # but NOT "chore: prepare vX.Y.Z pre-release" (those SHOULD publish).
          release_re='^chore: prepare v[0-9]+\.[0-9]+\.[0-9]+( stable)? release'

          # Direct push of a release-prep commit (e.g. cutting a stable).
          commit_subject=$(git log -1 --format=%s)
          if echo "$commit_subject" | grep -qE "$release_re"; then
            echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] Commit '${commit_subject}' is a release-prep; skipping pre-release publish."
            skip=true
          fi

          # Merge that brought in a release-prep commit (e.g. "Merge pull request #N from .../release/vX.Y.Z").
          # The pre-release workflow triggers on the merge push; without this, merging a stable-prep branch
          # would publish <committed-minor>.<run> pre-releases on the stable line and hijack Open VSX
          # 'latest' (see the 3.85.14 incident after merging the v3.85.0 stable-prep).
          if [ "$skip" = "false" ] && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            merged_subject=$(git log HEAD^2 -1 --format=%s)
            if echo "$merged_subject" | grep -qE "$release_re"; then
              echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] Merge brought in release-prep '${merged_subject}'; skipping pre-release publish."
              skip=true
            fi
          fi

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "::notice::[CI:PRERELEASE:RELEASE-CHECK] skip=${skip}"
          echo "::endgroup::"

      - name: Fail fast when no marketplace token is configured
        # A "successful" run that publishes nothing is a silent failure. Fail
        # loudly when neither registry token is set so the run turns red and
        # triggers notifications instead of quietly skipping both publishes.
        if: steps.release-check.outputs.skip != 'true' && env.VSCE_PAT == '' && env.OVSX_PAT == ''
        run: |
          echo "::group::[CI:PRERELEASE:TOKEN-GUARD] Checking marketplace tokens"
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD] Neither VSCE_PAT nor OVSX_PAT is configured in the marketplace-prerelease environment — the pre-release cannot be published to any registry."
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD] Add a token at: Settings → Environments → marketplace-prerelease → Add secret, then re-run this workflow."
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD]   VSCE_PAT: VS Code Marketplace PAT (Manage scope, publisher 'xavier-arosemena')"
          echo "::error::[CI:PRERELEASE:TOKEN-GUARD]   OVSX_PAT: https://open-vsx.org/user-settings/tokens (publisher 'xavier-arosemena')"
          echo "::endgroup::"
          exit 1

      - name: Verify announcement data for the committed version
        # Release-readiness gate for the "What's New" popup (bug #265), run on the
        # COMMITTED checkout BEFORE the "Set pre-release version" step mutates
        # src/package.json. The packaged pre-release version is derived
        # (`<major>.<minor>.<run>`, see below) and has no CHANGELOG section or
        # announcement entry by design, so the strict announcement gate must never
        # run against it at packaging time — verify-announcement-version.mjs skips
        # itself when PKG_RELEASE_CHANNEL=prerelease (set on the package steps
        # below). Verifying here, while the committed version (which DOES carry
        # announcement data) is still in place, keeps the bug #265 protection for
        # pre-release builds without failing the package.
        #
        # Republish note: after this fix is merged, a pre-release MUST be
        # re-published from master (push, or dispatch this workflow) so the merged
        # features — red-team mode and the VS Code Marketplace links — actually
        # ship: the last published pre-release (v3.84.11) predates them, and no
        # automation can backfill a publish that never ran.
        if: steps.release-check.outputs.skip != 'true'
        run: |
          echo "::group::[CI:PRERELEASE:ANNOUNCEMENT] Verifying announcement data for the committed version"
          node scripts/verify-announcement-version.mjs
          echo "::notice::[CI:PRERELEASE:ANNOUNCEMENT] announcement data verified for the committed version"
          echo "::endgroup::"

      - name: Set pre-release version
        if: steps.release-check.outputs.skip != 'true'
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "::group::[CI:PRERELEASE:VERSION] Setting pre-release version"
          node <<'EOF'
          const fs = require("fs")
          const pkgPath = "src/package.json"
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"))
          const [major, minor] = pkg.version.split(".").map(Number)
          // Pre-releases must be PLAIN major.minor.patch: the VS Code Marketplace
          // does not support semver pre-release tags (e.g. `-pre-release.N`) — it
          // only supports major.minor.patch, and versions must be different between
          // pre-release and regular
          // (https://code.visualstudio.com/api/working-with-extensions/publishing-extension#prerelease-extensions).
          // The pre-release nature is carried by the
          // `Microsoft.VisualStudio.Code.PreRelease` manifest marker (stamped below
          // and by `vsce package --pre-release`), not by the version string.
          //
          // VERSION SCHEME (decided policy, matching the "chore: prepare v3.84.0
          // pre-release" commit 2070bd8ad): the COMMITTED `src/package.json`
          // version IS the pre-release line version. The release process bumps it
          // to the "gap" minor between stables (stable 3.83.0 → committed 3.84.0
          // pre-release line → next stable 3.85.0) and ships announcement data
          // keyed to that committed version. We publish the committed MAJOR.MINOR
          // with the patch replaced by the run number (`<major>.<minor>.<run>`,
          // e.g. 3.84.<run>), which keeps every pre-release build unique while
          // staying:
          //   (a) above the latest stable (3.83.0), so the Marketplace offers
          //       "Install Pre-Release Version";
          //   (b) below the NEXT stable (3.85.0), so the next stable outranks them
          //       on Open VSX's `latest` alias; and
          //   (c) on the committed line, so it never collides with a stable.
          // Do NOT add 1 to the minor here: the committed version already sits on
          // the gap minor, and adding 1 would publish 3.85.<run> and collide with
          // the next stable 3.85.0.
          const prereleaseVersion = `${major}.${minor}.${Number(process.env.RUN_NUMBER)}`

          pkg.version = prereleaseVersion
          // Stamp the VS Code pre-release marker into package.json as well.
          // `vsce package --pre-release` only writes
          // `Microsoft.VisualStudio.Code.PreRelease` to the XML
          // `extension.vsixmanifest` (what the VS Code Marketplace reads), but
          // the ovsx CLI drops `--pre-release` for pre-built .vsix files and
          // Open VSX detects pre-releases from the `extension/package.json`
          // JSON manifest inside the VSIX. Without this stamp the Open VSX
          // upload would be flagged as a regular stable version instead of a
          // pre-release (see bug #243).
          pkg["Microsoft.VisualStudio.Code.PreRelease"] = true
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, "\t")}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `number=${prereleaseVersion}\n`)
          console.log(`Pre-release version set to ${prereleaseVersion}`)
          EOF
          echo "::notice::[CI:PRERELEASE:VERSION] pre-release version set"
          echo "::endgroup::"

      - name: Build workspace packages
        if: steps.release-check.outputs.skip != 'true'
        env:
          PKG_RELEASE_CHANNEL: prerelease
        run: |
          echo "::group::[CI:PRERELEASE:BUILD] Building workspace packages"
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build
          echo "::notice::[CI:PRERELEASE:BUILD] workspace packages built"
          echo "::endgroup::"

      - name: Package pre-release VSIX
        if: steps.release-check.outputs.skip != 'true'
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PKG_RELEASE_CHANNEL: prerelease
        run: |
          echo "::group::[CI:PRERELEASE:PACKAGE] Packaging pre-release VSIX"
          mkdir -p bin
          pnpm --filter ./src exec vsce package --pre-release --no-dependencies --out ../bin
          echo "::notice::[CI:PRERELEASE:PACKAGE] pre-release VSIX packaged"
          echo "::endgroup::"

      - name: Verify VSIX contents
        if: steps.release-check.outputs.skip != 'true'
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          echo "::group::[CI:PRERELEASE:VERIFY-VSIX] Verifying VSIX contents"
          vsix_path="bin/roo-plus-${VERSION_NUMBER}.vsix"
          unzip -l "$vsix_path" > /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-plus-vsix-contents.txt
          echo "::notice::[CI:PRERELEASE:VERIFY-VSIX] VSIX contents verified"
          echo "::endgroup::"

      - name: Validate packaged manifest identity
        if: steps.release-check.outputs.skip != 'true'
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          echo "::group::[CI:PRERELEASE:MANIFEST] Validating packaged manifest identity"
          vsix_path="bin/roo-plus-${VERSION_NUMBER}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')
          artifact_prerelease=$(unzip -p "$vsix_path" extension/package.json | jq -r '."Microsoft.VisualStudio.Code.PreRelease" // empty')

          test "$artifact_name" = "roo-plus"
          test "$artifact_publisher" = "xavier-arosemena"
          # Open VSX reads this marker from extension/package.json to flag the
          # version as a pre-release (the ovsx CLI ignores --pre-release for a
          # pre-built .vsix). Fail loudly if it is missing so a regression can
          # never publish a "pre-release" as a stable version again (bug #243).
          test "$artifact_prerelease" = "true"
          echo "::notice::[CI:PRERELEASE:MANIFEST] packaged manifest identity OK: $artifact_name / $artifact_publisher (pre-release marker: $artifact_prerelease)"
          echo "::endgroup::"

      - name: Publish pre-release to VS Code Marketplace
        if: steps.release-check.outputs.skip != 'true' && env.VSCE_PAT != ''
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          echo "::group::[CI:PRERELEASE:PUBLISH:VSCE] Publishing pre-release to VS Code Marketplace"
          npx @vscode/vsce publish --pre-release --skip-duplicate --packagePath "bin/roo-plus-${VERSION_NUMBER}.vsix"
          echo "::notice::[CI:PRERELEASE:PUBLISH:VSCE] Published or skipped existing xavier-arosemena.roo-plus ${VERSION_NUMBER} as a VS Code Marketplace pre-release"
          echo "::endgroup::"

      # `ovsx publish` ignores --pre-release for an already-packaged .vsix (it only
      # applies when ovsx does the packaging itself), so the pre-release marker must
      # already be embedded in the VSIX. `vsce package --pre-release` writes
      # Microsoft.VisualStudio.Code.PreRelease to the XML extension.vsixmanifest
      # (what the VS Code Marketplace reads); the "Set pre-release version" step also
      # stamps it into extension/package.json, which is what Open VSX reads to flag
      # the version as a pre-release (see bug #243). The "Validate packaged manifest
      # identity" step asserts both are present before we get here.
      #
      # Open VSX's "latest" alias resolves to the highest semver across stable and
      # pre-release alike (pre-release only breaks ties at equal major.minor.patch),
      # so a pre-release build can transiently become "latest" until the next stable
      # outranks it. The committed-line scheme (pre-releases on the committed gap
      # minor, e.g. 3.84.<run>, next stable one minor higher, 3.85.0) guarantees the
      # next stable always outranks the pre-releases, so this
      # is transient per release cycle. This mirrors how Marketplace pre-release users
      # track the newest published version — an accepted trade-off.
      - name: Publish pre-release to Open VSX Registry
        if: steps.release-check.outputs.skip != 'true' && env.OVSX_PAT != ''
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          echo "::group::[CI:PRERELEASE:PUBLISH:OVSX] Publishing pre-release to Open VSX Registry"
          set -o pipefail
          publish_output=$(pnpm exec ovsx publish "bin/roo-plus-${VERSION_NUMBER}.vsix" --skip-duplicate 2>&1 | tee /dev/stderr)
          if echo "$publish_output" | grep -q "is already published"; then
            echo "::notice::[CI:PRERELEASE:PUBLISH:OVSX] xavier-arosemena.roo-plus ${VERSION_NUMBER} was already published to Open VSX; skipped."
          else
            echo "::notice::[CI:PRERELEASE:PUBLISH:OVSX] Published xavier-arosemena.roo-plus ${VERSION_NUMBER} as an Open VSX pre-release"
          fi
          echo "::endgroup::"

      - name: Upload pre-release VSIX artifact
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roo-plus-prerelease-${{ github.sha }}
          path: bin/roo-plus-*.vsix
          retention-days: 7

      # Failure notification. Runs only when a previous step failed AND a Slack
      # webhook is configured; continue-on-error so a notification problem can
      # never mask the underlying failure.
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}
          workflow-name: "Publish Pre-release Version"
          # Single-job workflow with no `needs`, so `toJson(needs)` would be `{}`.
          # This step only runs when the job already failed (`failure()`), so a
          # static object naming the current job is the correct input here.
          failed-jobs: '{"publish-prerelease":{"result":"failure"}}'
