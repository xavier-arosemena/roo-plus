name: Code QA

on:
    workflow_dispatch:
    push:
        branches: [master]
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
    merge_group:
        types: [checks_requested]

# Least privilege: every job below escalates only where it needs to.
permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        # Only meaningful for PRs — validates the dependency diff of the pull
        # request against GitHub's advisory database before merge.
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  # This job never pushes — don't persist the GITHUB_TOKEN.
                  persist-credentials: false
            - name: Dependency review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

    static-analysis:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false
                  # Needed to run verify-submodule-pin.mjs / verify-roomodes-sync.mjs:
                  # a missing or wrong-pin submodule is a packaging hazard for the VSIX.
                  submodules: recursive
                  # PRECONDITION — FULL FORK HISTORY (WS-12). `pnpm test:scripts` runs
                  # the register spec, which asserts the LIVE register under
                  # `--verify --repo-only`; that profile is merge-base-free but NOT
                  # object-free (`synced-fork-sha` needs the fork's commit objects, and
                  # `row-sha-resolves`/`header-tip` the register's). A depth-1 checkout
                  # makes that spec red for the wrong reason, so keep `fetch-depth: 0`.
                  fetch-depth: 0
            - name: Reject invisible / homoglyph Unicode
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:UNICODE] Scanning for invisible / homoglyph Unicode"
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:UNICODE] scanning src webview-ui packages apps .github"
                  if grep -rnP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}\x{FEFF}\x{00AD}]' \
                      --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                      --include='*.cjs' --include='*.cts' --include='*.mts' --include='*.sh' \
                      --include='*.yml' --include='*.yaml' \
                      --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=out \
                      --exclude-dir=coverage --exclude-dir=.turbo --exclude-dir=.vinxi \
                      src webview-ui packages apps .github; then
                      echo "::error::[CI:CODE-QA:STATIC-ANALYSIS:UNICODE] Found invisible or homoglyph Unicode characters (zero-width / bidi-override / BOM / soft hyphen)"
                      exit 1
                  fi
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:UNICODE] no invisible/homoglyph characters found"
                  echo "::endgroup::"
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            # Privacy guard for the disclosed-infrastructure leak (DEBT.md item G):
            # the repository is PUBLIC, so a routable IPv4 literal committed under
            # docs/ is an infrastructure disclosure. Allow-list is explicit
            # (127.0.0.1, 0.0.0.0, RFC 5737 documentation ranges); everything else —
            # private space included — fails. Runs on node (setup above).
            - name: Reject public IPv4 literals in docs (privacy guard)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:DOCS-IPV4] Scanning docs/ for non-localhost IPv4 literals"
                  node scripts/verify-docs-no-public-ip.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:DOCS-IPV4] no non-localhost IPv4 literals found under docs/"
                  echo "::endgroup::"
            - name: Verify custom-modes submodule pin & committed artifact sync
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:SUBMODULE] Verifying submodule pin + .roomodes sync"
                  node scripts/verify-submodule-pin.mjs
                  node scripts/verify-roomodes-sync.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:SUBMODULE] submodule pin and .roomodes sync verified"
                  echo "::endgroup::"
            - name: Enforce mode descriptions (ensure_descriptions.py --check)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:DESCRIPTIONS] Enforcing mode descriptions (--check)"
                  python3 -c "import yaml" >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
                  python3 scripts/ensure_descriptions.py --check
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:DESCRIPTIONS] mode descriptions gate passed"
                  echo "::endgroup::"
            # WS-12: the register spec asserts the LIVE register with `--verify
            # --repo-only`, whose rows cite UPSTREAM commits a fork-only clone lacks.
            # Fetch exactly those objects FIRST (origin preferred, bounded upstream
            # fallback) so the spec — and this job — are red only on real defects.
            # This is also an early, explicit register gate for the PR.
            - name: Fetch the upstream-sync register objects (WS-12)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:REGISTER-OBJECTS] Making the register's commit objects available"
                  node scripts/upstream-sync-triage.mjs --verify --repo-only --fetch-missing-objects
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:REGISTER-OBJECTS] register objects available (origin preferred)"
                  echo "::endgroup::"
            - name: Run scripts unit tests (sync + submodule pin gate)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:SCRIPT-TESTS] Running scripts unit tests"
                  pnpm run test:scripts
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:SCRIPT-TESTS] scripts unit tests passed"
                  echo "::endgroup::"
            - name: Verify all translations are complete
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:TRANSLATIONS] Verifying translations are complete"
                  node scripts/find-missing-translations.js
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:TRANSLATIONS] translations verification passed"
                  echo "::endgroup::"
            - name: Run knip checks
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:KNIP] Running knip checks"
                  pnpm knip
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:KNIP] knip checks passed"
                  echo "::endgroup::"
            - name: Verify message-schema ratchet (S1-M4)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:MESSAGE-SCHEMAS] Verifying message-schema ratchet (S1-M4)"
                  pnpm --filter @roo-code/types build
                  node scripts/verify-message-schemas.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:MESSAGE-SCHEMAS] message-schema ratchet passed"
                  echo "::endgroup::"
            # Release-readiness gate for the Semble code-index feature: confirms
            # the GitHub release tagged at SEMBLE_VERSION ships a
            # checksums-sha256.txt manifest whose hashes match the hardcoded
            # SEMBLE_SHA256 table. Non-strict (default) so transient network
            # errors don't block CI, but it FAILS (exit 1) on a checksum,
            # version, or archive mismatch — i.e. if SEMBLE_VERSION drifts from
            # SEMBLE_SHA256 / SEMBLE_ARCHIVES.
            - name: Verify Semble release checksums (release-readiness gate)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:SEMBLE-CHECKSUMS] Verifying Semble release checksums"
                  node scripts/verify-semble-checksums.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:SEMBLE-CHECKSUMS] Semble checksums gate passed (or skipped offline)"
                  echo "::endgroup::"
            # Release-governance gate for the Semble code-index feature
            # (docs/SEMBLE-RELEASE-GOVERNANCE.md, review item 2c of
            # plans/architecture-review-code-index-semble.md): a diff that
            # changes SEMBLE_VERSION without SEMBLE_SHA256 (or vice versa) in
            # src/services/code-index/semble/semble-downloader.ts is rejected.
            # Compares the working tree against the merge base with a base ref
            # (GITHUB_BASE_REF → origin/<ref>, then origin/main / origin/master;
            # override with --base). Default mode SKIPs (exit 0) when no base
            # commit is resolvable (e.g. a shallow/fresh checkout) so an infra
            # reason never blocks a PR; it HARD FAILS (exit 1) whenever the
            # diff is verifiable and the coupling is violated.
            - name: Verify Semble version↔checksum coupling (release-governance gate)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:SEMBLE-COUPLING] Verifying Semble version↔checksum coupling"
                  node scripts/verify-semble-release-coupling.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:SEMBLE-COUPLING] Semble coupling gate passed (or skipped)"
                  echo "::endgroup::"
            # Alignment gate for the Qdrant code-index core (architecture review
            # #6 — plans/architecture-review-code-index-semble.md): keeps the
            # non-Semble core byte-identical to upstream Zoo-Code so upstream
            # improvements cherry-pick cleanly. Fast lane (pure git + file
            # comparison, no build). Network behavior: uses the local
            # upstream/main ref when present, otherwise fetches upstream main
            # (depth=1); on a fetch/network failure the script SKIPs (exit 0) in
            # default mode, so an infra hiccup never blocks a PR — it enforces
            # only when it can actually verify. Pass --strict to make
            # upstream-unavailable a hard failure.
            - name: Verify code-index core stays aligned with upstream Zoo-Code
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:UPSTREAM-ALIGNMENT] Verifying code-index core alignment with upstream"
                  node scripts/verify-upstream-code-index-alignment.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:UPSTREAM-ALIGNMENT] upstream alignment gate passed (or skipped)"
                  echo "::endgroup::"
            # Release-readiness gate for the "What's New" announcement popup
            # (bug #265): the popup content lives in the generated
            # src/shared/announcements.ts (derived from src/CHANGELOG.md). A
            # version bump without regenerating that asset would silently stop
            # the popup from showing, so this gate HARD FAILS (exit 1) whenever
            # the current version in src/package.json has no matching, non-empty
            # announcement data in sync with the changelog.
            - name: Verify announcement data matches the current version (release-readiness gate)
              run: |
                  echo "::group::[CI:CODE-QA:STATIC-ANALYSIS:ANNOUNCEMENT] Verifying announcement data matches the current version"
                  node scripts/verify-announcement-version.mjs
                  echo "::notice::[CI:CODE-QA:STATIC-ANALYSIS:ANNOUNCEMENT] announcement data verified for the current version"
                  echo "::endgroup::"

    # WS-8 item 1 — the flagship provenance control is only enforceable with a
    # keyring. The full profile is a POST-REFRESH gate (it re-derives coverage from
    # the register's recorded tip, so it is not run per-PR); it runs here on master
    # pushes with --signature-strict. If the GitHub web-flow key cannot be
    # provisioned the keyring step FAILS CLOSED with "keyring not configured"
    # instead of letting the run pass as an advisory, so "unverifiable" can never
    # be mistaken for a pass.
    upstream-sync-provenance:
        name: upstream-sync provenance (post-refresh gate, master push only)
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  # This job never pushes.
                  persist-credentials: false
                  # The full profile needs fork history to resolve every row SHA
                  # and compute the merge base.
                  fetch-depth: 0
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Import the GitHub web-flow signing key (provenance keyring)
              run: |
                  echo "::group::[CI:CODE-QA:UPSTREAM-PROVENANCE:KEYRING] Importing the GitHub web-flow signing key"
                  if ! curl -fsSL https://github.com/web-flow.gpg -o /tmp/web-flow.gpg; then
                      echo "::error::[CI:CODE-QA:UPSTREAM-PROVENANCE:KEYRING] keyring not configured — could not download the GitHub web-flow key"
                      exit 1
                  fi
                  gpg --batch --quiet --import /tmp/web-flow.gpg
                  if ! gpg --list-keys --with-colons | grep -q '^pub:'; then
                      echo "::error::[CI:CODE-QA:UPSTREAM-PROVENANCE:KEYRING] keyring not configured — the GitHub web-flow key was not imported"
                      exit 1
                  fi
                  echo "::notice::[CI:CODE-QA:UPSTREAM-PROVENANCE:KEYRING] web-flow keyring configured"
                  echo "::endgroup::"
            - name: Pin upstream/main to the register's recorded tip (post-refresh)
              run: |
                  echo "::group::[CI:CODE-QA:UPSTREAM-PROVENANCE:PIN] Fetching upstream and pinning to the recorded tip"
                  git remote add upstream "https://github.com/Zoo-Code-Org/Zoo-Code.git" 2>/dev/null || true
                  SINCE=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parseBaseline } from "./scripts/upstream-sync-triage.mjs"; const b = parseBaseline(readFileSync("docs/upstream-sync/pending-upstream-commits.md", "utf8")); process.stdout.write(b.mergeBaseDate ?? "2026-08-19")')
                  git fetch --no-tags --shallow-since="$SINCE" upstream main
                  TIP=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parseBaseline } from "./scripts/upstream-sync-triage.mjs"; process.stdout.write(parseBaseline(readFileSync("docs/upstream-sync/pending-upstream-commits.md", "utf8")).upstreamTip ?? "")')
                  git update-ref refs/remotes/upstream/main "$(git rev-parse "${TIP}^{commit}")"
                  echo "::notice::[CI:CODE-QA:UPSTREAM-PROVENANCE:PIN] upstream/main pinned to ${TIP}"
                  echo "::endgroup::"
            - name: Verify ☑ provenance with a keyring and --signature-strict
              run: |
                  echo "::group::[CI:CODE-QA:UPSTREAM-PROVENANCE:VERIFY] Verifying ☑ provenance with signature enforcement"
                  node scripts/upstream-sync-triage.mjs --verify --signature-strict
                  echo "::notice::[CI:CODE-QA:UPSTREAM-PROVENANCE:VERIFY] provenance verified with enforced signatures"
                  echo "::endgroup::"

    audit-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run pnpm audit
              run: pnpm audit --audit-level=high

    compile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Lint
              run: pnpm lint
            - name: Check types
              run: pnpm check-types
            # Issue #250 systemic quality gate — webview build/test toolchain
            # parity. The webview test suite (vitest) and the production build
            # (vite) MUST compile with identical Babel/React tooling. A
            # divergence (e.g. babel-plugin-react-compiler enabled in
            # vite.config.ts but not vitest.config.ts) previously let the
            # 1,629-test suite stay green while the shipped webview crashed at
            # startup with React error #301 ("Too many re-renders"). This gate
            # rebuilds the production bundle and fails if it contains React
            # Compiler runtime markers, and fails if the react() plugin config
            # diverges across vite.config.ts / playwright-ct.config.ts /
            # vitest.config.ts. Runs on every PR and master push.
            - name: Verify webview build/test toolchain parity (issue #250 gate)
              run: |
                  echo "::group::[CI:CODE-QA:COMPILE:WEBVIEW-PARITY] Verifying webview build/test toolchain parity"
                  node webview-ui/scripts/verify-webview-build-parity.mjs
                  echo "::notice::[CI:CODE-QA:COMPILE:WEBVIEW-PARITY] webview toolchain parity gate passed"
                  echo "::endgroup::"

    unit-test:
        name: platform-unit-test (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # Windows runners are only triggered on manual dispatch because
                # they are significantly slower than Linux runners and provide
                # marginal additional signal for unit-test feedback. Linux
                # coverage already provides sufficient confidence for automated
                # CI runs.
                #
                # NOTE: `matrix` is NOT an available context in a job-level
                # `if` (only github/inputs/needs/vars), so the Windows combo is
                # conditionally injected into the matrix instead of skipped via
                # `if:`. A job-level `if` referencing `matrix` is a workflow
                # file parse error ("This run likely failed because of a
                # workflow file issue"). The `github` context IS available in
                # `strategy.matrix.include`, so we filter there.
                include:
                    - os: ubuntu-latest
                      name: ubuntu-latest
                      codecov-flag: ubuntu
                      upload-coverage: true
                    - ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"windows-latest","name":"windows-latest","codecov-flag":"windows","upload-coverage":false}]' || '[]') }}
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  # `roo-plus:test:coverage` triggers `roo-plus#bundle`, whose
                  # prebundle step runs verify-submodule-pin.mjs — a missing or
                  # wrong-pin submodule is a packaging hazard for the VSIX, so it
                  # must be checked out at the recorded pin (same as the
                  # static-analysis and e2e jobs).
                  submodules: recursive
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Restore Turbo cache
              id: turbo-cache
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-
                      ${{ runner.os }}-turbo-
            - name: Run non-core coverage
              run: |
                  echo "::group::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] Running non-core coverage"
                  pnpm turbo run test:coverage --filter="!@roo-code/core" --log-order grouped --output-logs new-only
                  echo "::notice::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] non-core coverage complete"
                  echo "::endgroup::"
            - name: Run core unit coverage
              run: |
                  echo "::group::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] Running core unit coverage"
                  pnpm turbo run test:coverage:unit --filter="@roo-code/core" --log-order grouped --output-logs new-only
                  echo "::notice::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] core unit coverage complete"
                  echo "::endgroup::"
            - name: Run core integration coverage
              run: |
                  echo "::group::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] Running core integration coverage"
                  pnpm turbo run test:coverage:integration --filter="@roo-code/core" --log-order grouped --output-logs new-only
                  echo "::notice::[CI:CODE-QA:UNIT-TEST:${{ matrix.name }}] core integration coverage complete"
                  echo "::endgroup::"
            - name: Save Turbo cache
              if: steps.turbo-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: .turbo/cache
                  key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
            # Only ubuntu uploads coverage. Windows still runs the same test
            # lanes for behavioral confidence, but duplicating coverage uploads
            # there mostly adds Codecov overhead without changing pass/fail
            # behavior.
            # Coverage is uploaded in separate steps so each LCOV gets the
            # correct flag set. Codecov double-counts overlapping lines when a
            # single upload carries multiple flags whose paths overlap, so the
            # core lanes and webview lane must be uploaded individually with
            # their own flag.
            # See https://docs.codecov.com/docs/flags
            # Coverage uploads must never fail CI: the CODECOV_TOKEN secret is
            # not currently configured, so codecov/codecov-action falls back to
            # tokenless upload which fails for PR builds ("Token required - not
            # valid tokenless upload"). Uploading the token when the repo secret
            # is added will restore coverage reporting; until then these steps
            # degrade gracefully (report-only) instead of blocking merges.
            # NOTE: the `secrets` context cannot be used in `if:` expressions
            # (workflow parse error), so we use continue-on-error instead.
            - name: Upload non-core coverage to Codecov
              if: matrix.upload-coverage
              continue-on-error: true
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: >-
                      src/coverage/lcov.info,
                      packages/cloud/coverage/lcov.info,
                      apps/cli/coverage/lcov.info
                  disable_search: true
                  flags: ${{ matrix.codecov-flag }}
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload webview JSDOM coverage to Codecov
              if: matrix.upload-coverage
              continue-on-error: true
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: webview-ui/coverage/lcov.info
                  disable_search: true
                  flags: webview-ui
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload core unit coverage to Codecov
              if: matrix.upload-coverage
              continue-on-error: true
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: packages/core/coverage/unit/lcov.info
                  disable_search: true
                  flags: ${{ matrix.codecov-flag }},core-unit
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload core integration coverage to Codecov
              if: matrix.upload-coverage
              continue-on-error: true
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: packages/core/coverage/integration/lcov.info
                  disable_search: true
                  flags: ${{ matrix.codecov-flag }},core-integration
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload coverage reports to GitHub
              if: matrix.upload-coverage
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: coverage-reports-${{ matrix.name }}
                  path: |
                      src/coverage/lcov.info
                      webview-ui/coverage/lcov.info
                      packages/cloud/coverage/lcov.info
                      apps/cli/coverage/lcov.info
                      packages/core/coverage/unit/lcov.info
                      packages/core/coverage/integration/lcov.info
                  retention-days: 7

    # HD-03 / H-03 / F-A-7 / F-D-2 (WS-3) — the upstream-sync register is the queue
    # that gates every sync batch, and until this job existed nothing in CI asserted
    # the LIVE register: `--verify` fails closed on a shallow checkout before it ever
    # reads the file, and `pnpm test:scripts` exercises the spec with injected probes
    # only. This job runs the merge-base-free profile (`--repo-only`) so it is green
    # wherever the repo ships while still failing on a corrupted row.
    upstream-register:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Base-repo context only: no secrets, no untrusted code execution, nothing
        # to leak — so it is safe and cheap on every PR and merge group.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false
                  # PRECONDITION — FULL FORK HISTORY (WS-1/CP-1, measured; WS-12).
                  # `--verify --repo-only` is merge-base-free but NOT object-free:
                  # `synced-fork-sha` needs the fork's history, and `row-sha-resolves`/
                  # `header-tip` need the register's UPSTREAM commit objects, which a
                  # fork-only clone does not have. Keep `fetch-depth: 0`; do not
                  # narrow it.
                  fetch-depth: 0
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  # The register check imports local files only — no dependencies.
                  skip-install: "true"
            # WS-12: this job gates the LIVE register. The profile computes no upstream
            # merge base, but it DOES need the register's commit objects, so it fetches
            # the missing ones first — preferring the fork's own `origin`
            # (`git fetch --no-tags --filter=blob:none origin <full-sha>…`) and falling
            # back to the bounded `git fetch --no-tags --shallow-since=<register date>
            # upstream main` only when `origin` cannot serve them. An object that stays
            # unresolvable FAILS with one of two distinct messages — "does not resolve"
            # (a bad row SHA) or "object could not be fetched" (the environment served
            # nothing) — never a skip.
            - name: Verify the upstream-sync register (merge-base-free profile)
              run: |
                  echo "::group::[CI:CODE-QA:UPSTREAM-REGISTER] Verifying the upstream-sync register"
                  node scripts/upstream-sync-triage.mjs --verify --repo-only --fetch-missing-objects
