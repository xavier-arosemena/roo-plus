name: Publish Stable Extension

on:
  workflow_dispatch:

# Least privilege: publish-stable escalates to contents: write via its own
# job-level permissions block.
permissions:
  contents: read

# THE single enforcement switch for the VSIX audit (DEBT #23).
#
#   "false" (default) = ADVISORY. The audit still runs, every finding is
#                       annotated, and NOTHING fails because of it.
#   "true"            = ENFORCE. Exit 1 (unregistered/escalated findings) and
#                       exit 2 (degraded coverage / tool failure) fail the run,
#                       and a MISSING result is a failure rather than a pass.
#
# Flip it to "true" ONLY after `scripts/vsix-audit-register.json` has been
# regenerated from a current artefact and every finding triaged. Exact line and
# procedure: docs/runbooks/release-publishing.md, "VSIX audit enforcement switch".
#
# Independently of this switch, the whole audit cluster (YARA-X install, scan,
# enforcement) runs AFTER the Open VSX publish and AFTER the GitHub release, so
# no audit outcome can prevent, delay or abort delivery.
env:
  VSIX_AUDIT_ENFORCE: "false"

# Never run two stable publishes concurrently — overlapping manual dispatches
# must not race on the same marketplace version.
concurrency:
  group: marketplace-production
  cancel-in-progress: false

jobs:
  # Approval gate for manual dispatches. Users with write/admin access bypass
  # the PR-approval check; everyone else must have an approved PR for the
  # dispatched commit.
  check-pr-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check actor permissions
        id: check_perms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::group::[CI:MARKETPLACE:APPROVAL:PERMS] Checking actor permissions"
          permission=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission // "none"')
          echo "::notice::[CI:MARKETPLACE:APPROVAL:PERMS] Actor ${ACTOR} has permission: ${permission}"
          echo "permission=${permission}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      - name: Check PR approval status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Bypass PR approval check for users with write or admin permissions
          if [ "${{ steps.check_perms.outputs.permission }}" = "write" ] || \
             [ "${{ steps.check_perms.outputs.permission }}" = "admin" ]; then
            echo "Actor has ${permission} access — bypassing PR approval check."
            exit 0
          fi

          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --header "Accept: application/vnd.github+json" \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No PR found for commit ${SHA}. Deployment requires an approved PR."
            exit 1
          fi

          review_decision=$(gh api graphql \
            -f owner="${REPO%%/*}" \
            -f name="${REPO#*/}" \
            -F number="$pr_number" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewDecision
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewDecision // "NONE"')

          echo "PR #${pr_number} review_decision: ${review_decision}"

          if [ "$review_decision" != "APPROVED" ]; then
            echo "PR #${pr_number} is not approved (state: ${review_decision}). Deployment blocked."
            exit 1
          fi

          echo "PR #${pr_number} is approved. Proceeding."

  publish-stable:
    needs: [check-pr-approval]
    # Only runs after the approval gate succeeds.
    if: ${{ needs.check-pr-approval.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace-production
    permissions:
      contents: write
    # Expose the marketplace tokens as job-level env so steps can gate on them
    # with `if: env.* != ''` — GitHub Actions does NOT allow the `secrets`
    # context inside `if:` expressions (workflow parse error otherwise).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The VSIX embeds modes regenerated from the custom-modes submodule at
          # build time, so CI MUST check it out at the recorded pin — otherwise the
          # build would silently reuse stale committed artifacts.
          submodules: recursive

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Prepare extension publish
        uses: ./.github/actions/prepare-extension
        with:
          log-prefix: MARKETPLACE
          environment: marketplace-production
          # Stable publishes always run from master.
          require-master-ref: "true"
          validate-tokens: "true"
          # The VS Code Marketplace is currently unavailable as a publish target, so
          # a broken/expired VSCE PAT must NOT abort the run before the Open VSX
          # publish — Open VSX is the registry this stable release MUST land on. The
          # VS publish step is continue-on-error and its outcome is reported by the
          # summary step at the end of the job.
          fail-on-invalid-vsce-pat: "false"
          vsce-pat: ${{ secrets.VSCE_PAT }}
          ovsx-pat: ${{ secrets.OVSX_PAT }}

      - name: Guard committed version is not already published on either registry
        # Fail-closed pre-flight (added after the 2026-09-25 pre-release hijack,
        # docs/incidents/2026-09-25-prerelease-guard-bypass-3.88.10.md). A version
        # that already exists on a registry — as a stable OR as a pre-release —
        # cannot be re-issued: `vsce publish` (no --skip-duplicate here) errors,
        # and `ovsx publish --skip-duplicate` silently no-ops. Checking BEFORE the
        # build/package steps turns a late, ambiguous publish failure into a fast,
        # explicit red run.
        run: |
          echo "::group::[CI:MARKETPLACE:GUARD] Verifying the committed version is not already published"
          node --input-type=module <<'EOF'
          import fs from "node:fs"
          import https from "node:https"

          const version = JSON.parse(fs.readFileSync("src/package.json", "utf8")).version
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.log(`::error::[CI:MARKETPLACE:GUARD] committed version "${version}" is not a plain major.minor.patch`)
            process.exit(1)
          }

          function getJson(hostname, reqPath, options = {}) {
            return new Promise((resolve, reject) => {
              const req = https.request({ hostname, path: reqPath, timeout: 15000, ...options }, (res) => {
                let body = ""
                res.setEncoding("utf8")
                res.on("data", (chunk) => { body += chunk })
                res.on("end", () => {
                  if (res.statusCode !== 200) {
                    reject(new Error(`${hostname} returned HTTP ${res.statusCode}`))
                    return
                  }
                  try {
                    resolve(JSON.parse(body))
                  } catch (err) {
                    reject(err)
                  }
                })
              })
              req.on("timeout", () => { req.destroy(new Error(`${hostname} request timed out`)) })
              req.on("error", reject)
              if (options.body) req.write(options.body)
              req.end()
            })
          }

          const queryBody = JSON.stringify({
            filters: [{ criteria: [{ filterType: 7, value: "xavier-arosemena.roo-plus" }] }],
            flags: 1, // IncludeVersions
          })

          let openVsx = []
          let marketplace = []
          let marketplaceLookupError = null
          try {
            const ovsx = await getJson("open-vsx.org", "/api/xavier-arosemena/roo-plus")
            openVsx = Object.keys(ovsx.allVersions || {})
          } catch (err) {
            console.log(`::error::[CI:MARKETPLACE:GUARD] could not query Open VSX (${err.message}); aborting rather than risking a duplicate publish on the registry this stable MUST land on`)
            process.exit(1)
          }
          try {
            const mkt = await getJson("marketplace.visualstudio.com", "/_apis/public/gallery/extensionquery", {
              method: "POST",
              headers: {
                Accept: "application/json;api-version=7.2-preview.1",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(queryBody),
              },
              body: queryBody,
            })
            marketplace = (mkt?.results?.[0]?.extensions?.[0]?.versions || []).map((v) => v.version)
          } catch (err) {
            marketplaceLookupError = err.message
          }

          const onOpenVsx = openVsx.includes(version)
          const onMarketplace = marketplace.includes(version)
          console.log(`[CI:MARKETPLACE:GUARD] ${version} — Open VSX: ${onOpenVsx ? "EXISTS" : "absent"}, VS Marketplace: ${marketplaceLookupError ? "lookup FAILED" : onMarketplace ? "EXISTS" : "absent"}`)

          if (onOpenVsx) {
            console.log(`::error::[CI:MARKETPLACE:GUARD] ${version} is ALREADY published to Open VSX — a version that already exists cannot be re-published. Bump src/package.json to the next patch on this minor line and re-dispatch.`)
            process.exit(1)
          }

          // The VS Code Marketplace is currently unavailable as a publish target, so
          // its leg of this guard is ADVISORY: it must never be able to block an Open
          // VSX release. Open VSX above stays fail-closed. Provenance problems still
          // surface loudly as warnings.
          if (marketplaceLookupError) {
            console.log(`::warning::[CI:MARKETPLACE:GUARD] VS Marketplace version lookup failed (${marketplaceLookupError}) — continuing; the Open VSX release is unaffected.`)
          } else if (onMarketplace) {
            console.log(`::warning::[CI:MARKETPLACE:GUARD] ${version} already exists on the VS Code Marketplace — the VS publish below will be skipped/fail, but Open VSX is unaffected. If this version was consumed by mistake, bump to the next patch.`)
          }

          console.log(`::notice::[CI:MARKETPLACE:GUARD] ${version} is unpublished on Open VSX — proceeding`)
          EOF
          echo "::endgroup::"

      - name: Verify Semble checksums (SEMBLE_VERSION lockstep)
        run: |
          echo "::group::[CI:MARKETPLACE:SEMBLE] Verifying Semble checksums (--strict)"
          node scripts/verify-semble-checksums.mjs --strict
          echo "::notice::[CI:MARKETPLACE:SEMBLE] Semble checksums verified"
          echo "::endgroup::"

      - name: Build workspace packages
        run: |
          echo "::group::[CI:MARKETPLACE:BUILD] Building workspace packages"
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build
          echo "::notice::[CI:MARKETPLACE:BUILD] workspace packages built"
          echo "::endgroup::"

      - name: Package extension
        run: |
          echo "::group::[CI:MARKETPLACE:PACKAGE] Packaging VSIX"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm --filter ./src vsix

          vsix_path="bin/roo-plus-${package_version}.vsix"
          test -f "$vsix_path"

          unzip -l "$vsix_path" > /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.nls.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/roo-plus-vsix-contents.txt
          echo "::notice::[CI:MARKETPLACE:PACKAGE] VSIX packaged: $vsix_path"
          echo "::endgroup::"

      - name: Validate packaged manifest identity
        run: |
          echo "::group::[CI:MARKETPLACE:MANIFEST] Validating packaged manifest identity"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')

          test "$artifact_name" = "roo-plus"
          test "$artifact_publisher" = "xavier-arosemena"
          echo "::notice::[CI:MARKETPLACE:MANIFEST] packaged manifest identity OK: $artifact_name / $artifact_publisher"
          echo "::endgroup::"

      # Attribution gate: every production dependency and every bundled binary
      # component (DCG) is described in THIRD-PARTY-NOTICES.md, the bundled
      # archives hash to the pinned values, and the src/ copy matches the root
      # file. Deterministic and offline, so it is safe to block on.
      - name: Verify third-party notices (verify-third-party-notices.mjs)
        run: |
          echo "::group::[CI:MARKETPLACE:NOTICES] Verifying third-party attribution"
          node scripts/verify-third-party-notices.mjs
          echo "::notice::[CI:MARKETPLACE:NOTICES] notices complete (dependencies + shipped binaries + DCG pins)"
          echo "::endgroup::"

      # OPEN VSX FIRST. Open VSX is the registry this stable release targets and
      # must not be gated on the VS Code Marketplace, which is currently
      # unavailable. This step is deliberately NOT continue-on-error: a failure
      # here stops the run before the GitHub release/tag is created.
      - name: Publish to Open VSX Registry
        id: publish-ovsx
        if: env.OVSX_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:OVSX] Publishing to Open VSX Registry"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm exec ovsx publish "bin/roo-plus-${package_version}.vsix" --skip-duplicate
          echo "::notice::[CI:MARKETPLACE:PUBLISH:OVSX] Published xavier-arosemena.roo-plus ${package_version} to Open VSX Registry"
          echo "::endgroup::"

      - name: Fail fast when the Open VSX token is missing
        # A "successful" stable run that publishes nothing to the registry this
        # release targets would be a silent failure.
        if: env.OVSX_PAT == ''
        run: |
          echo "::error::[CI:MARKETPLACE:TOKEN-GUARD] OVSX_PAT is not configured in the marketplace-production environment — the stable cannot be published to Open VSX."
          echo "::error::[CI:MARKETPLACE:TOKEN-GUARD] Add it at: Settings → Environments → marketplace-production → Add secret."
          exit 1

      - name: Publish to VS Code Marketplace
        id: publish-vsce
        # continue-on-error: the VS Code Marketplace is currently unavailable as a
        # publish target and must never abort a release Open VSX has already
        # received. The outcome is reported by the summary step at the end.
        continue-on-error: true
        # A hung Marketplace request must not hold the job open — Open VSX has
        # already been published at this point, and continue-on-error does not
        # cover a hang.
        timeout-minutes: 15
        if: env.VSCE_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:VSCE] Publishing to VS Code Marketplace"
          package_version=$(node -p "require('./src/package.json').version")
          npx @vscode/vsce publish --packagePath "bin/roo-plus-${package_version}.vsix"
          echo "::notice::[CI:MARKETPLACE:PUBLISH:VSCE] Published xavier-arosemena.roo-plus ${package_version} to VS Code Marketplace"
          echo "::endgroup::"

      # Post-publish visibility check. `vsce publish` returning success is NOT
      # proof of publication: during the 2026-10 Marketplace incident the upload
      # reported success while every /vspackage URL returned 404 and the publisher
      # console returned `429 - Woah, that's a lot of requests`
      # (RequestBlockedException, resource 'Concurrency', namespace 'VSID').
      # `always()` so it also runs when the publish step failed — that is exactly
      # when the answer matters. Advisory (`--advisory` exits 0) so the Marketplace
      # can never fail a stable release that Open VSX has already delivered.
      - name: Verify the stable is visible in the VS Code Marketplace
        id: verify-vsce-presence
        if: always() && env.VSCE_PAT != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          MARKETPLACE_PUBLISHER: xavier-arosemena
        run: |
          echo "::group::[CI:MARKETPLACE:PRESENCE] Verifying Marketplace visibility"
          node scripts/verify-marketplace-presence.mjs --advisory --wait 300
          echo "::notice::[CI:MARKETPLACE:PRESENCE] visibility check finished (advisory — Open VSX is unaffected)"
          echo "::endgroup::"

      # Keep the packaged artifact attached to the run for audit and manual
      # install even if the GitHub release creation below is ever skipped.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roo-plus-stable-${{ github.sha }}
          path: bin/roo-plus-*.vsix
          retention-days: 7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          tag_name="v${package_version}"
          vsix_path="bin/roo-plus-${package_version}.vsix"

          # Under the iterate-then-stabilize policy the changelog keeps ONE
          # accumulating section per minor (`## [<major>.<minor>.0]`) while the
          # stable version may be a later patch on that minor (e.g. 3.88.3), so
          # resolve the release notes to the LINE BASE section; fall back to a
          # generic title when no section is found.
          line_version=$(node -e "const p=require('./src/package.json').version.split('.'); process.stdout.write(p[0]+'.'+p[1]+'.0')")
          changelog_content=$(awk -v version="$line_version" '
            $0 ~ "^## \\[" version "\\]" { found = 1 }
            found && $0 == "---" { exit }
            found && $0 ~ "^## " && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$changelog_content" ]; then
            changelog_content="Release ${tag_name}"
          fi
          printf "%s\n" "$changelog_content" > /tmp/roo-plus-release-notes.md

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$vsix_path" --clobber
          else
            gh release create "$tag_name" \
              --title "Roo+ ${tag_name}" \
              --notes-file /tmp/roo-plus-release-notes.md \
              --target "$GITHUB_SHA" \
              "$vsix_path"
          fi

      # =====================================================================
      # VSIX AUDIT CLUSTER — ADVISORY BY DEFAULT, AND DELIBERATELY LAST.
      #
      # PLACEMENT IS THE SAFETY PROPERTY: the YARA-X install, the scan and the
      # enforcement step all run AFTER the Open VSX publish and AFTER the GitHub
      # release/tag above. Nothing here is on the path to either deliverable, so
      # no audit outcome — registry outage, timeout, hang, tool crash, finding —
      # can prevent, delay or abort the publish. `continue-on-error` on the
      # install and the scan plus per-step timeouts bound the worst case; the
      # enforcement step is the ONLY place this cluster can turn the run red,
      # and it can only do so once the artefact has already shipped.
      #
      # POLICY (DEBT #23): exit 1 = unregistered/escalated findings, exit 2 =
      # degraded coverage or tool failure, exit 3 = usage. Enforcement is gated
      # by the workflow-level VSIX_AUDIT_ENFORCE switch (default "false" =
      # advisory). See docs/runbooks/release-publishing.md.
      # =====================================================================
      - name: Install YARA-X v1.20.0 (full-coverage VSIX audit)
        id: yara-x
        # A GitHub outage, rate limit, DNS failure or withdrawn asset degrades to
        # "audit not run" — the scan then reports DEGRADED coverage (exit 2) —
        # and never to "release aborted".
        continue-on-error: true
        # A hung download must not consume the 30-minute job budget.
        timeout-minutes: 5
        run: |
          echo "::group::[CI:MARKETPLACE:AUDIT] Installing YARA-X v1.20.0"
          # --max-time/--retry: bounded transfer, and a flapping endpoint gets
          # three attempts instead of failing the audit's toolchain outright.
          curl -sSfL --max-time 120 --retry 3 --retry-delay 5 -o /tmp/yara-x.tar.gz \
            "https://github.com/VirusTotal/yara-x/releases/download/v1.20.0/yara-x-v1.20.0-x86_64-unknown-linux-gnu.tar.gz"
          echo "cabb8df46492fff59c51261302c71ed9cb2cef393d3f0ca560801a34a8e24cbe  /tmp/yara-x.tar.gz" | sha256sum -c -
          tar -xzf /tmp/yara-x.tar.gz -C /tmp
          sudo install -m 0755 /tmp/yr /usr/local/bin/yr
          yr --version
          echo "::endgroup::"

      - name: Audit packaged VSIX (node scripts/vsix-audit.mjs --publish)
        id: vsix-audit
        continue-on-error: true
        # The scanned artefact is 39 MB with a full extraction; 15 minutes is
        # ample, and a wedge is bounded here rather than by the job timeout.
        timeout-minutes: 15
        run: |
          echo "::group::[CI:MARKETPLACE:AUDIT] Auditing the packaged VSIX"
          # FAIL-CLOSED SENTINEL. Outputs are appended to $GITHUB_OUTPUT as they
          # are written, so this survives a cancellation or a kill at the timeout:
          # if the scan never reports, the output stays "2" ("audit did not
          # complete") instead of being empty. The enforcement step below treats
          # both 2 and "" as gate FAILURES when enforcement is on — an empty
          # result must never read as a pass.
          echo "exit_code=2" >> "$GITHUB_OUTPUT"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"
          set +e
          node scripts/vsix-audit.mjs "$vsix_path" --publish
          audit_code=$?
          set -e
          echo "exit_code=${audit_code}" >> "$GITHUB_OUTPUT"
          case "$audit_code" in
            0) echo "::notice::[CI:MARKETPLACE:AUDIT] vsix-audit passed with full coverage" ;;
            1) echo "::warning::[CI:MARKETPLACE:AUDIT] unregistered or escalated findings. The artefact has ALREADY shipped; if enforcement is on, this run is reported as not release-clean." ;;
            2) echo "::warning::[CI:MARKETPLACE:AUDIT] DEGRADED coverage (YARA-X missing) or audit tool failure — this is NOT a full audit." ;;
            *) echo "::warning::[CI:MARKETPLACE:AUDIT] unexpected vsix-audit exit code ${audit_code}." ;;
          esac
          echo "::endgroup::"
          exit 0

      # Enforcement point for the VSIX audit gate. Deliberately LAST: the artefact
      # has already reached Open VSX AND the GitHub release, so an audit failure
      # here can never block or delay the only live registry — it can only mark
      # the run as not release-clean.
      - name: Enforce VSIX audit gate (advisory unless VSIX_AUDIT_ENFORCE=true)
        if: always()
        env:
          # Passed through env (never interpolated into the script) so a missing
          # output is an empty string the shell can test for explicitly.
          AUDIT_EXIT_CODE: ${{ steps.vsix-audit.outputs.exit_code }}
        run: |
          echo "::group::[CI:MARKETPLACE:AUDIT-GATE] VSIX audit gate"
          enforce="${VSIX_AUDIT_ENFORCE:-false}"
          code="${AUDIT_EXIT_CODE}"
          echo "[CI:MARKETPLACE:AUDIT-GATE] VSIX_AUDIT_ENFORCE=${enforce} audit_exit_code=${code:-<none>}"

          if [ "$enforce" != "true" ]; then
            echo "::notice::[CI:MARKETPLACE:AUDIT-GATE] ADVISORY (VSIX_AUDIT_ENFORCE=${enforce}): no audit outcome fails this run. Open VSX and the GitHub release are unaffected."
            if [ -z "$code" ] || [ "$code" != "0" ]; then
              echo "::warning::[CI:MARKETPLACE:AUDIT-GATE] audit result: ${code:-no result (the audit did not run)}. Triage the findings and regenerate the by-design register only after reviewing each one (DEBT #23). Never widen the register to make a scan pass."
            fi
            echo "::endgroup::"
            exit 0
          fi

          # ENFORCING. A missing result is a FAILURE, not a pass (M4).
          if [ -z "$code" ]; then
            echo "::error::[CI:MARKETPLACE:AUDIT-GATE] no audit result: the audit step was skipped, cancelled, timed out or died before writing one. Treating as gate FAILURE, never as a pass."
            echo "::endgroup::"
            exit 1
          fi
          if [ "$code" = "0" ]; then
            echo "::notice::[CI:MARKETPLACE:AUDIT-GATE] full-coverage audit passed."
            echo "::endgroup::"
            exit 0
          fi
          echo "::error::[CI:MARKETPLACE:AUDIT-GATE] VSIX audit gate failed (exit ${code}). Open VSX has already received this version and is unaffected — the registry is never blocked by this gate — but this stable is NOT release-clean."
          echo "::error::[CI:MARKETPLACE:AUDIT-GATE] Triage the findings and regenerate the by-design register only after reviewing each one (DEBT #23). Never widen the register to make a scan pass."
          echo "::endgroup::"
          exit 1

      # The publish step can report success while nothing landed (phantom success,
      # 2026-10). Report that distinctly from an outright publish failure.
      - name: Publish summary — warn when the Marketplace listing is not visible
        if: steps.verify-vsce-presence.outputs.verified == 'false'
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          echo "::warning::[CI:MARKETPLACE:SUMMARY] xavier-arosemena.roo-plus ${package_version} is NOT visible in the public Marketplace (status: ${{ steps.verify-vsce-presence.outputs.status }}). This is EXPECTED: the listing was removed by enforcement on 2026-10-20 and will not be reinstated. Open VSX is unaffected and this release is still DELIVERED — see docs/runbooks/release-publishing.md §Status."
          {
            echo ""
            echo "| VS Code Marketplace | ⚠️ not visible in the public gallery |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary — warn (do not fail) when only the VS Marketplace failed
        # The VS Code Marketplace is currently unavailable as a publish target.
        # Open VSX is the registry the stable release MUST land on, and that step is
        # fail-closed (the job can only reach here if Open VSX succeeded). A VS
        # Marketplace failure is therefore reported as a WARNING, so a delivered
        # Open VSX release is not masked by a red run — while staying visible in the
        # log, the run annotations, and the job summary.
        if: steps.publish-vsce.outcome == 'failure'
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          echo "::warning::[CI:MARKETPLACE:SUMMARY] xavier-arosemena.roo-plus ${package_version} was published to Open VSX but NOT to the VS Code Marketplace (the listing was removed by enforcement and will not be reinstated). The stable release is considered DELIVERED on Open VSX; see docs/runbooks/release-publishing.md §Status."
          {
            echo "## Stable publish summary — \`${package_version}\`"
            echo ""
            echo "| Registry | Result |"
            echo "| --- | --- |"
            echo "| Open VSX | ✅ published |"
            echo "| VS Code Marketplace | ⛔ unavailable (listing removed by enforcement 2026-10-20) |"
          } >> "$GITHUB_STEP_SUMMARY"
