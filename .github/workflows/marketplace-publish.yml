name: Publish Stable Extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Least privilege: publish-stable escalates to contents: write via its own
# job-level permissions block.
permissions:
  contents: read

jobs:
  check-pr-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check actor permissions
        id: check_perms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::group::[CI:MARKETPLACE:APPROVAL:PERMS] Checking actor permissions"
          permission=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission // "none"')
          echo "::notice::[CI:MARKETPLACE:APPROVAL:PERMS] Actor ${ACTOR} has permission: ${permission}"
          echo "permission=${permission}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      - name: Check PR approval status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Bypass PR approval check for users with write or admin permissions
          if [ "${{ steps.check_perms.outputs.permission }}" = "write" ] || \
             [ "${{ steps.check_perms.outputs.permission }}" = "admin" ]; then
            echo "Actor has ${permission} access — bypassing PR approval check."
            exit 0
          fi

          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --header "Accept: application/vnd.github+json" \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No PR found for commit ${SHA}. Deployment requires an approved PR."
            exit 1
          fi

          review_decision=$(gh api graphql \
            -f owner="${REPO%%/*}" \
            -f name="${REPO#*/}" \
            -F number="$pr_number" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewDecision
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewDecision // "NONE"')

          echo "PR #${pr_number} review_decision: ${review_decision}"

          if [ "$review_decision" != "APPROVED" ]; then
            echo "PR #${pr_number} is not approved (state: ${review_decision}). Deployment blocked."
            exit 1
          fi

          echo "PR #${pr_number} is approved. Proceeding."

  publish-stable:
    needs: [check-pr-approval]
    runs-on: ubuntu-latest
    environment: marketplace-production
    permissions:
      contents: write
    # Expose the marketplace tokens as job-level env so steps can gate on them
    # with `if: env.* != ''` — GitHub Actions does NOT allow the `secrets`
    # context inside `if:` expressions (workflow parse error otherwise).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The VSIX embeds modes regenerated from the custom-modes submodule at
          # build time, so CI MUST check it out at the recorded pin — otherwise the
          # build would silently reuse stale committed artifacts.
          submodules: recursive

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Verify custom-modes submodule pin & committed artifact sync
        run: |
          echo "::group::[CI:MARKETPLACE:SUBMODULE] Verifying submodule pin + .roomodes sync"
          node scripts/verify-submodule-pin.mjs
          node scripts/verify-roomodes-sync.mjs
          echo "::notice::[CI:MARKETPLACE:SUBMODULE] submodule pin and .roomodes sync verified"
          echo "::endgroup::"

      - name: Validate package identity
        run: |
          echo "::group::[CI:MARKETPLACE:IDENTITY] Validating package identity"
          package_name=$(node -p "require('./src/package.json').name")
          publisher=$(node -p "require('./src/package.json').publisher")
       
          test "$package_name" = "roo-plus"
          test "$publisher" = "xavier-arosemena"
          echo "::notice::[CI:MARKETPLACE:IDENTITY] package identity OK: $package_name / $publisher"
          echo "::endgroup::"

      - name: Validate publish ref
        run: |
          echo "::group::[CI:MARKETPLACE:REF] Validating publish ref"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::[CI:MARKETPLACE:REF] Manual stable publishes must run from master, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "::notice::[CI:MARKETPLACE:REF] publish ref OK: $GITHUB_REF_NAME"
          echo "::endgroup::"

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          echo "::group::[CI:MARKETPLACE:TAG] Validating release tag"
          package_version=$(node -p "require('./src/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::[CI:MARKETPLACE:TAG] Tag v${tag_version} does not match src/package.json version ${package_version}."
            exit 1
          fi
          echo "::notice::[CI:MARKETPLACE:TAG] release tag matches package version: $package_version"
          echo "::endgroup::"

      - name: Validate VS Code Marketplace PAT (if configured)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          echo "::group::[CI:MARKETPLACE:VSCE-PAT] Validating VS Code Marketplace PAT"
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::[CI:MARKETPLACE:VSCE-PAT] VSCE_PAT is not configured — the VS Code Marketplace publish step will be skipped."
            echo "::notice::[CI:MARKETPLACE:VSCE-PAT] To enable it, add a Personal Access Token (Manage scope, publisher 'xavier-arosemena') as the VSCE_PAT secret in the marketplace-production environment."
            echo "::endgroup::"
            exit 0
          fi
          if ! npx @vscode/vsce verify-pat xavier-arosemena > /tmp/vsce-pat.log 2>&1; then
            echo "::error::[CI:MARKETPLACE:VSCE-PAT] VSCE_PAT is invalid, expired, or lacks 'Manage' permission for publisher 'xavier-arosemena'."
            echo "::error::[CI:MARKETPLACE:VSCE-PAT] Regenerate a PAT at https://marketplace.visualstudio.com/manage/publishers/xavier-arosemena (Marketplace -> Manage)."
            echo "::error::[CI:MARKETPLACE:VSCE-PAT] Update the VSCE_PAT secret in the marketplace-production environment, then re-run."
            cat /tmp/vsce-pat.log
            exit 1
          fi
          echo "::notice::[CI:MARKETPLACE:VSCE-PAT] VS Code Marketplace PAT verified for publisher xavier-arosemena"
          echo "::endgroup::"

      - name: Validate Open VSX access token (if configured)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "::group::[CI:MARKETPLACE:OVSX-PAT] Validating Open VSX access token"
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::[CI:MARKETPLACE:OVSX-PAT] OVSX_PAT is not configured — the Open VSX publish step will be skipped."
            echo "::notice::[CI:MARKETPLACE:OVSX-PAT] To enable it, create an access token at https://open-vsx.org/user-settings/tokens (publisher 'xavier-arosemena') and add it as the OVSX_PAT secret in the marketplace-production environment."
            echo "::endgroup::"
            exit 0
          fi
          echo "::notice::[CI:MARKETPLACE:OVSX-PAT] Open VSX access token configured"
          echo "::endgroup::"

      - name: Verify Semble checksums (SEMBLE_VERSION lockstep)
        run: |
          echo "::group::[CI:MARKETPLACE:SEMBLE] Verifying Semble checksums (--strict)"
          node scripts/verify-semble-checksums.mjs --strict
          echo "::notice::[CI:MARKETPLACE:SEMBLE] Semble checksums verified"
          echo "::endgroup::"

      - name: Build workspace packages
        run: |
          echo "::group::[CI:MARKETPLACE:BUILD] Building workspace packages"
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build
          echo "::notice::[CI:MARKETPLACE:BUILD] workspace packages built"
          echo "::endgroup::"

      - name: Package extension
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          echo "::group::[CI:MARKETPLACE:PACKAGE] Packaging VSIX"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm --filter ./src vsix

          vsix_path="bin/roo-plus-${package_version}.vsix"
          test -f "$vsix_path"

          unzip -l "$vsix_path" > /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.nls.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/roo-plus-vsix-contents.txt
          echo "::notice::[CI:MARKETPLACE:PACKAGE] VSIX packaged: $vsix_path"
          echo "::endgroup::"

      - name: Validate packaged manifest identity
        run: |
          echo "::group::[CI:MARKETPLACE:MANIFEST] Validating packaged manifest identity"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')
       
          test "$artifact_name" = "roo-plus"
          test "$artifact_publisher" = "xavier-arosemena"
          echo "::notice::[CI:MARKETPLACE:MANIFEST] packaged manifest identity OK: $artifact_name / $artifact_publisher"
          echo "::endgroup::"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:VSCE] Publishing to VS Code Marketplace"
          package_version=$(node -p "require('./src/package.json').version")
          npx @vscode/vsce publish --packagePath "bin/roo-plus-${package_version}.vsix"
          echo "::notice::[CI:MARKETPLACE:PUBLISH:VSCE] Published xavier-arosemena.roo-plus ${package_version} to VS Code Marketplace"
          echo "::endgroup::"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:OVSX] Publishing to Open VSX Registry"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm exec ovsx publish "bin/roo-plus-${package_version}.vsix" --skip-duplicate
          echo "::notice::[CI:MARKETPLACE:PUBLISH:OVSX] Published xavier-arosemena.roo-plus ${package_version} to Open VSX Registry"
          echo "::endgroup::"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_name="$GITHUB_REF_NAME"
          else
            tag_name="v${package_version}"
          fi
          vsix_path="bin/roo-plus-${package_version}.vsix"

          changelog_content=$(awk -v version="$package_version" '
            $0 ~ "^## \\[" version "\\]" { found = 1 }
            found && $0 == "---" { exit }
            found && $0 ~ "^## " && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$changelog_content" ]; then
            changelog_content="Release ${tag_name}"
          fi
          printf "%s\n" "$changelog_content" > /tmp/roo-plus-release-notes.md

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$vsix_path" --clobber
          else
            gh release create "$tag_name" \
              --title "Roo+ ${tag_name}" \
              --notes-file /tmp/roo-plus-release-notes.md \
              --target "$GITHUB_SHA" \
              "$vsix_path"
          fi
