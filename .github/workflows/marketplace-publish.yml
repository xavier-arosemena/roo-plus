name: Publish Stable Extension

on:
  workflow_dispatch:

# Least privilege: publish-stable escalates to contents: write via its own
# job-level permissions block.
permissions:
  contents: read

# Never run two stable publishes concurrently — overlapping manual dispatches
# must not race on the same marketplace version.
concurrency:
  group: marketplace-production
  cancel-in-progress: false

jobs:
  # Approval gate for manual dispatches. Users with write/admin access bypass
  # the PR-approval check; everyone else must have an approved PR for the
  # dispatched commit.
  check-pr-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check actor permissions
        id: check_perms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::group::[CI:MARKETPLACE:APPROVAL:PERMS] Checking actor permissions"
          permission=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission // "none"')
          echo "::notice::[CI:MARKETPLACE:APPROVAL:PERMS] Actor ${ACTOR} has permission: ${permission}"
          echo "permission=${permission}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      - name: Check PR approval status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Bypass PR approval check for users with write or admin permissions
          if [ "${{ steps.check_perms.outputs.permission }}" = "write" ] || \
             [ "${{ steps.check_perms.outputs.permission }}" = "admin" ]; then
            echo "Actor has ${permission} access — bypassing PR approval check."
            exit 0
          fi

          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --header "Accept: application/vnd.github+json" \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No PR found for commit ${SHA}. Deployment requires an approved PR."
            exit 1
          fi

          review_decision=$(gh api graphql \
            -f owner="${REPO%%/*}" \
            -f name="${REPO#*/}" \
            -F number="$pr_number" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewDecision
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewDecision // "NONE"')

          echo "PR #${pr_number} review_decision: ${review_decision}"

          if [ "$review_decision" != "APPROVED" ]; then
            echo "PR #${pr_number} is not approved (state: ${review_decision}). Deployment blocked."
            exit 1
          fi

          echo "PR #${pr_number} is approved. Proceeding."

  publish-stable:
    needs: [check-pr-approval]
    # Only runs after the approval gate succeeds.
    if: ${{ needs.check-pr-approval.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace-production
    permissions:
      contents: write
    # Expose the marketplace tokens as job-level env so steps can gate on them
    # with `if: env.* != ''` — GitHub Actions does NOT allow the `secrets`
    # context inside `if:` expressions (workflow parse error otherwise).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The VSIX embeds modes regenerated from the custom-modes submodule at
          # build time, so CI MUST check it out at the recorded pin — otherwise the
          # build would silently reuse stale committed artifacts.
          submodules: recursive

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Prepare extension publish
        uses: ./.github/actions/prepare-extension
        with:
          log-prefix: MARKETPLACE
          environment: marketplace-production
          # Stable publishes always run from master.
          require-master-ref: "true"
          validate-tokens: "true"
          vsce-pat: ${{ secrets.VSCE_PAT }}
          ovsx-pat: ${{ secrets.OVSX_PAT }}

      - name: Verify Semble checksums (SEMBLE_VERSION lockstep)
        run: |
          echo "::group::[CI:MARKETPLACE:SEMBLE] Verifying Semble checksums (--strict)"
          node scripts/verify-semble-checksums.mjs --strict
          echo "::notice::[CI:MARKETPLACE:SEMBLE] Semble checksums verified"
          echo "::endgroup::"

      - name: Build workspace packages
        run: |
          echo "::group::[CI:MARKETPLACE:BUILD] Building workspace packages"
          pnpm --filter @roo-code/build build
          pnpm --filter @roo-code/vscode-webview build
          echo "::notice::[CI:MARKETPLACE:BUILD] workspace packages built"
          echo "::endgroup::"

      - name: Package extension
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          echo "::group::[CI:MARKETPLACE:PACKAGE] Packaging VSIX"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm --filter ./src vsix

          vsix_path="bin/roo-plus-${package_version}.vsix"
          test -f "$vsix_path"

          unzip -l "$vsix_path" > /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/package.nls.json" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/dist/extension.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/roo-plus-vsix-contents.txt
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/roo-plus-vsix-contents.txt
          echo "::notice::[CI:MARKETPLACE:PACKAGE] VSIX packaged: $vsix_path"
          echo "::endgroup::"

      - name: Validate packaged manifest identity
        run: |
          echo "::group::[CI:MARKETPLACE:MANIFEST] Validating packaged manifest identity"
          package_version=$(node -p "require('./src/package.json').version")
          vsix_path="bin/roo-plus-${package_version}.vsix"

          artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
          artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')

          test "$artifact_name" = "roo-plus"
          test "$artifact_publisher" = "xavier-arosemena"
          echo "::notice::[CI:MARKETPLACE:MANIFEST] packaged manifest identity OK: $artifact_name / $artifact_publisher"
          echo "::endgroup::"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:VSCE] Publishing to VS Code Marketplace"
          package_version=$(node -p "require('./src/package.json').version")
          npx @vscode/vsce publish --packagePath "bin/roo-plus-${package_version}.vsix"
          echo "::notice::[CI:MARKETPLACE:PUBLISH:VSCE] Published xavier-arosemena.roo-plus ${package_version} to VS Code Marketplace"
          echo "::endgroup::"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          echo "::group::[CI:MARKETPLACE:PUBLISH:OVSX] Publishing to Open VSX Registry"
          package_version=$(node -p "require('./src/package.json').version")
          pnpm exec ovsx publish "bin/roo-plus-${package_version}.vsix" --skip-duplicate
          echo "::notice::[CI:MARKETPLACE:PUBLISH:OVSX] Published xavier-arosemena.roo-plus ${package_version} to Open VSX Registry"
          echo "::endgroup::"

      # Keep the packaged artifact attached to the run for audit and manual
      # install even if the GitHub release creation below is ever skipped.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roo-plus-stable-${{ github.sha }}
          path: bin/roo-plus-*.vsix
          retention-days: 7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "require('./src/package.json').version")
          tag_name="v${package_version}"
          vsix_path="bin/roo-plus-${package_version}.vsix"

          # Under the iterate-then-stabilize policy the changelog keeps ONE
          # accumulating section per minor (`## [<major>.<minor>.0]`) while the
          # stable version may be a later patch on that minor (e.g. 3.88.3), so
          # resolve the release notes to the LINE BASE section; fall back to a
          # generic title when no section is found.
          line_version=$(node -e "const p=require('./src/package.json').version.split('.'); process.stdout.write(p[0]+'.'+p[1]+'.0')")
          changelog_content=$(awk -v version="$line_version" '
            $0 ~ "^## \\[" version "\\]" { found = 1 }
            found && $0 == "---" { exit }
            found && $0 ~ "^## " && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$changelog_content" ]; then
            changelog_content="Release ${tag_name}"
          fi
          printf "%s\n" "$changelog_content" > /tmp/roo-plus-release-notes.md

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$vsix_path" --clobber
          else
            gh release create "$tag_name" \
              --title "Roo+ ${tag_name}" \
              --notes-file /tmp/roo-plus-release-notes.md \
              --target "$GITHUB_SHA" \
              "$vsix_path"
          fi
