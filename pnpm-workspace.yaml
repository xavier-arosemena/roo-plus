packages:
    - "src"
    - "webview-ui"
    - "apps/*"
    - "packages/*"

onlyBuiltDependencies:
    - "@vscode/ripgrep"

overrides:
    # ── Already-pinned versions (moved from package.json) ──
    tar-fs: ">=3.1.1"
    esbuild: "0.28.1"
    rollup: "4.60.4"
    vite: "8.1.6"
    # undici (HIGH x3: patched >=6.29.1). Deliberately the caret, NOT ">=": an
    # open-ended range resolves to the undici 8 major, which changes the fetch /
    # Agent surface this extension uses. Stay on the 6.x line the code targets.
    undici: "^6.29.1"
    form-data: ">=4.0.4"
    bluebird: ">=3.7.2"
    glob: "11.1.0"
    "@types/react": "18.3.31"
    "@types/react-dom": "18.3.7"
    csstype: "3.2.3"
    # zod — pinned so schema instances stay identical across the extension, the
    # webview and packages/*. NOT fixed here: the open HIGH is zod <4.6.6, and
    # every workspace resolves zod 3, so clearing it needs one repo-wide zod 4
    # migration, not a per-package bump. See docs/runbooks/dependency-advisories.md.
    zod: "3.25.76"

    # ── HIGH severity fixes ──

    # minimatch — path-specific to keep major versions aligned
    "mocha>minimatch": "^5.1.8"
    "@typescript-eslint/typescript-estree>minimatch": "^9.0.7"
    "readdir-glob>minimatch": "^5.1.8"
    "@eslint/eslintrc>minimatch": "^5.1.8"
    "@vscode/vsce>minimatch": "^10.0.3"

    # fast-uri (HIGH + MODERATE advisories: GHSA-q3j6-qgpj-74h6, GHSA-v39h-62p7-jpjc,
    # GHSA-hrr3-gc8f-f4qj, …) — 3.x below 3.1.8 is vulnerable to inconsistent
    # host-case normalization via percent-encoded octets. Stay on the 3.x line.
    fast-uri: "^3.1.8"

    # ip-address (1 HIGH + 2 MEDIUM: GHSA-mwp4-54f8-5fhr, …) — transitive via
    # @modelcontextprotocol/sdk>express-rate-limit>ip-address
    ip-address: "^10.3.1"

    # js-yaml — path-specific for different major versions (patched for
    # CVE-2026-59870: 3.x >=3.15.2, 4.x >=4.3.2)
    "@changesets/parse>js-yaml": "^4.3.2"
    "read-yaml-file>js-yaml": "^3.15.2"
    "gray-matter>js-yaml": "^3.15.2"
    "rc-config-loader>js-yaml": "^3.15.2"
    "@eslint/eslintrc>js-yaml": "^4.3.2"
    "knip>js-yaml": "^4.3.2"
    "mocha>js-yaml": "^4.3.2"
    "@vscode/vsce>js-yaml": "^4.3.2"
    "@textlint/linter-formatter>js-yaml": "^4.3.2"

    # nanoid (HIGH: GHSA-2v37-7h3g-55p8 — custom generators can loop
    # indefinitely when size is zero) — patched >=3.3.18; reached via
    # apps/cli>tsup>postcss
    nanoid: ">=3.3.18"

    # hono (1 HIGH + 8 MEDIUM)
    hono: "^4.12.34"
    "@hono/node-server": "^2.0.12"

    # tmp
    "@vscode/vsce>tmp": "^0.2.6"
    "ovsx>tmp": "^0.2.7"
    "exceljs>tmp": "^0.2.7"

    # linkify-it
    linkify-it: "^5.0.2"

    # shell-quote (CRITICAL: 1.8.4–1.10.x patched only in >=1.11.0). This global
    # override wins over the workspace declarations, so it must move with them.
    shell-quote: "^1.11.0"

    # path-to-regexp
    path-to-regexp: "^8.4.0"

    # serialize-javascript (HIGH: GHSA-5c6j-r48x-rmvq — RCE via RegExp.flags /
    # Date.toISOString; patched >=7.0.3; mocha resolves 6.x so force the 7 line)
    "mocha>serialize-javascript": "^7.0.5"

    # @xmldom/xmldom (HIGH: GHSA-…, patched >=0.8.15) — transitive via src>mammoth
    "@xmldom/xmldom": ">=0.8.15"

    # smol-toml (HIGH: GHSA-7w5x-hrqm-74c2, patched >=1.7.1) — transitive via knip
    smol-toml: ">=1.7.1"

    # postcss (new CVE, patched >=8.5.18)
    postcss: ">=8.5.18"

    # ── HIGH severity fixes (Phase 2) ──

    # brace-expansion (HIGH + MODERATE) — everything below 5.0.12 is vulnerable
    # (GHSA stack-exhaustion on nested groups, plus the quadratic-time expansion
    # DoS GHSA-q2hr-2g5m-vwhr). Global single-version pin, as before.
    brace-expansion: ">=5.0.12"

    # @babel/core (LOW) — webview-ui>@vitejs/plugin-react>@babel/core stuck at 7.29.0
    "@vitejs/plugin-react>@babel/core": "^7.29.6"

    # body-parser (HIGH: patched >=2.4.0) — src>@modelcontextprotocol/sdk>express.
    # The path-specific override takes precedence over the global one below, so
    # both must name the patched minor.
    "express>body-parser": "^2.4.0"

    # dompurify (LOW) — webview-ui>mermaid>dompurify
    # (posthog-js was removed with telemetry, Marketplace #305 WS-A — its override is gone)
    "mermaid>dompurify": "^3.4.12"

    # ── MEDIUM severity fixes ──

    # mdast-util-to-hast
    mdast-util-to-hast: "^13.2.1"

    # markdown-it (HIGH + MODERATE in .>@vscode/vsce: patched >=14.3.2) — stay on
    # the 14.x line; 15.x is a breaking major that vsce has not adopted.
    markdown-it: "^14.3.2"

    # follow-redirects (HIGH in .>ovsx: patched >=1.16.2)
    follow-redirects: "^1.16.2"

    # express transitives under @modelcontextprotocol/sdk (CRITICAL/HIGH:
    # proxy-addr <2.0.8, body-parser <2.4.0). The sdk bump alone does not lift
    # these because express resolves its own ranges, so pin the patched minors.
    proxy-addr: "^2.0.8"
    body-parser: "^2.4.0"

    # source-map-js (HIGH: patched >=1.2.2) — transitive via
    # @vitest/coverage-v8>magicast and vite.
    source-map-js: "^1.2.2"

    # uuid — path-specific; exceljs uses uuid@^8, @azure/msal-node uses uuid@^8
    "exceljs>uuid": "^11.1.1"
    "@azure/msal-node>uuid": "^11.1.1"

    # protobufjs
    protobufjs: "^7.6.5"
