      - Note breaking changes, minimum runtime/tooling baselines, and migration steps.
      - Update manifests/lockfiles and document upgrade implications.

      ## CONFIDENCE-BOUNDED ROLE ASSIGNMENT TECHNIQUE

      ### Problem
      Telling an AI to "act as [role]" can be limiting — it inherits the character's knowledge boundaries and fallacies. Telling it to "be confident" risks confident hallucinations.

      ### Solution: Two-Prompt Fact-Grounding
      **Prompt 1 (Fact Gatherer)**: Instruct the AI to NOT answer the user's question. Instead, generate a list of facts, libraries, research points, or domain knowledge from its training data relevant to the prompt. Write this list targeting the same LLM as the audience (not a human).

      **Prompt 2 (Confident Expert)**: Pass the fact list to the answering assistant with: "You can confidently answer in these subjects that you are an expert in: [fact list]." Then ask the actual question.

      ### Why This Works
      - Limits responses to what the model actually knows
      - Makes the model confidently answer with information it's sure about
      - Prevents hallucination by grounding the response in pre-validated facts
      - The fact list acts as a knowledge boundary constraint

      ### Implementation Pattern
      ```
      # Prompt 1 (to fact-gatherer instance)
      "Do not answer the following question. Instead, generate a comprehensive list of facts, libraries, concepts, and research points from your training data that are relevant to: [USER_QUESTION]. Format the list for consumption by another LLM instance, not a human."

      # Prompt 2 (to answering instance)
      "You are an expert in the following verified subjects: [FACT_LIST_FROM_PROMPT_1]. Based on your expertise in these areas, answer this question confidently: [USER_QUESTION]"
      ```

      ### Use Cases
      - Technical questions requiring accurate library/API references
      - Domain-specific advice where hallucination risk is high
      - Multi-step reasoning where early errors cascade
      - Client-facing responses requiring factual grounding


      ## PROMPT ARCHITECT METHODOLOGY (2026 Best Practices)

      ### Overview
      A structured process for crafting production-grade prompts that produce consistent, high-fidelity outputs aligned with the user's unique voice, depth, and standards. Turns vague intentions into precise AI collaboration instruments.

      ### Core Design Principles

      #### 1. Role & Persona Assignment
      - Define precise expert identity with specific capabilities AND constraints
      - Include what the AI should know AND what it should avoid
      - Example: "You are a senior data scientist specializing in NLP, NOT a general assistant"
      - Always specify: expertise level, domain, communication style, and decision-making authority

      #### 2. Context & Examples (Few-Shot)
      - Provide 2-3 examples of desired input/output pairs
      - Draw examples from the user's actual communication history when possible
      - Show both the ideal response AND common mistakes to avoid
      - Format: "Example input: [X] → Ideal output: [Y] → Avoid: [Z]"

      #### 3. Process (Chain-of-Thought + Structured Sections)
      - Break complex tasks into explicit step-by-step instructions
      - Each step should have: input, action, output, and validation criteria
      - Use numbered lists for sequential processes
      - Use decision trees for conditional logic
      - Include "think aloud" directives for reasoning tasks

      #### 4. Output Format (Rigid Structure)
      - Define exact output structure with labeled sections
      - Use markdown headers, JSON schemas, or templates
      - Specify: length constraints, formatting rules, required sections
      - Include "DO" and "DON'T" examples for ambiguous areas
      - Make format machine-parseable when possible

      #### 5. Style Mirroring
      - Explicitly direct the AI to analyze and replicate the user's:
        - Tone (formal/casual/technical)
        - Vocabulary (industry jargon, preferred terms)
        - Formality level (academic/business/conversational)
        - Reasoning patterns (analytical/creative/systematic)
      - Provide 1-2 paragraphs of the user's writing as a style reference
      - Include directive: "Match the voice, depth, and register of the provided examples"

      #### 6. Iteration & Self-Critique Loop
      - Built-in self-critique: "Before finalizing, identify ONE weakness in your response and fix it"
      - Maximum 3 targeted clarification questions per response
      - Explicit refinement instruction: "If the output doesn't match criteria X, revise by doing Y"
      - Include success criteria that the AI can self-evaluate against

      #### 7. Guardrails & Anti-Hallucination
      - "No assumptions — if information is missing, ask rather than invent"
      - "Zero filler — every sentence must convey new information"
      - "Evidence-based reasoning — cite sources or state confidence level"
      - "Professional confidence without arrogance — assert expertise, acknowledge limitations"
      - "When uncertain, express uncertainty explicitly rather than fabricating answers"

      ### Prompt Delivery Format

      Every crafted prompt must include:

      1. **The Complete Prompt** — Ready-to-copy, addressing ChatGPT or equivalent frontier model
      2. **Critique Section** — Unsparing analysis of:
         - Weaknesses in the current prompt
         - Hidden assumptions that may cause failures
         - Optimization opportunities for better results
      3. **Refinement Questions** (max 3) — Targeted questions to gather missing details for the next iteration

      ### Iterative Refinement Process
      1. **Round 1**: Generate initial prompt from user's topic/goal
      2. **User Response**: Answer refinement questions
      3. **Round 2**: Strengthen prompt with additional examples/constraints
      4. **User Response**: Test prompt and report results
      5. **Round 3**: Final battle-tested version, model-agnostic where possible

      ### Prompt Quality Checklist
      - [ ] Clear role assignment with capabilities and constraints
      - [ ] 2-3 few-shot examples provided
      - [ ] Step-by-step process defined
      - [ ] Output format rigidly specified
      - [ ] Style mirroring directive included
      - [ ] Self-critique loop embedded
      - [ ] Anti-hallucination guardrails present
      - [ ] Success criteria defined
      - [ ] Critique section provided
      - [ ] Max 3 refinement questions included
      - [ ] Model-agnostic language used where possible
