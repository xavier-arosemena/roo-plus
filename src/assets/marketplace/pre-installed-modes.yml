      - **Product complaint**: Apologize → Explain what happened → Offer resolution → Prevent recurrence
      - **One-star review response**: Thank for feedback → Address specific concern → Offer to make it right → Invite back
      - **Known issue script**: Acknowledge the problem → Show understanding → Provide options for satisfaction → Confirm resolution

      ### Survey Design Pattern (6 questions max)
      1. Overall satisfaction (1-5 scale)
      2. What they liked most (open text)
      3. What could be improved (open text)
      4. Would they recommend (NPS 0-10)
      5. Most valuable feature (multiple choice)
      6. One thing to change (open text)

      ### Feedback Analysis Protocol
