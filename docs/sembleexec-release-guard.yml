# Semble installer release guard — drop into `Audare-est-Facere/sembleexec` as
# `.github/workflows/release-guard.yml` to enforce release-tag immutability and
# asset integrity on the installer side.
#
# IMPORTANT — what GitHub can and cannot enforce here:
# - There is NO pre-publish hook for GitHub Releases. A release is already
#   published by the time this workflow runs, so this guard is REACTIVE: it
#   makes a violation loud (failing check + actionable comment) but cannot
#   physically stop the publish.
# - PREVENTIVE control lives in repo settings + access discipline:
#     * Keep the set of people who can delete/re-upload release assets minimal.
#     * Keep "Allow force pushes" OFF and restrict tag deletion to admins only.
#     * Treat tags as append-only by convention; this workflow enforces it.
# - The AUTHORITATIVE enforcement boundary is the consumer repo (roo-plus):
#     * `scripts/verify-semble-release-coupling.mjs` forces SEMBLE_VERSION and
#       SEMBLE_SHA256 to change together, so a tag "fixed in place" can never
#       be silently adopted — any asset change requires a NEW tag + regenerated
#       checksums + a version bump in the same commit.
#
# What this guard checks when a release is published or re-triggered:
#   1. IMMUTABILITY — the tag must not have a prior release record. A release
#      created again on a tag that already had a release is a re-publish ("fix
#      in place") and fails. (GitHub normally forbids two releases on the same
#      tag, but assets can still be re-uploaded to an existing release — this
#      detects a re-run against an already-released tag via the API.)
#   2. ASSET INTEGRITY — every uploaded archive must appear in the release's
#      `checksums-sha256.txt` manifest AND its actual SHA-256 must match the
#      manifest entry. Missing/stale archives fail.
#   3. MINIMAL FUNCTIONALITY — on linux-x64 the archive is extracted and the
#      binary must pass `--help` advertising `search` and report a version via
#      `--version`. This is the consumer-side stub detection, mirrored here.
#
# Permissions: `contents: read` + `actions: write` (to fail the check). The
# `GITHUB_TOKEN` here is the default token of the installing repo.

name: release-guard

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect tag re-publish (immutability)
        id: immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # List all prior releases; if this tag appears in the history of
          # releases EXCLUDING the current event's release id, it is a re-publish.
          current_id="${{ github.event.release.id }}"
          prior="$(gh api "repos/${REPO}/releases" --jq "[.[] | select(.id != ${current_id}) | .tag_name] | index(\"${TAG}\")")"
          if [ "${prior}" != "null" ]; then
            echo "::error::Tag '${TAG}' was already released before (id ${current_id}). Re-uploading or re-publishing a tag is FORBIDDEN — cut a NEW tag (e.g. v0.5.3) instead of fixing v0.5.2 in place."
            echo "violation=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "violation=false" >> "$GITHUB_OUTPUT"
          echo "Tag '${TAG}' has no prior release record — OK."

      - name: Verify checksums manifest matches uploaded archives (integrity)
        id: integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].name')"
          # Download the manifest and every archive to a scratch dir.
          scratch="$(mktemp -d)"
          trap 'rm -rf "${scratch}"' EXIT
          cd "${scratch}"
          gh release download "${TAG}" --repo "${REPO}" --pattern 'checksums-sha256.txt' --clobber
          if [ ! -f checksums-sha256.txt ]; then
            echo "::error::Release ${TAG} is missing checksums-sha256.txt — refusing release."
            exit 1
          fi
          echo "--- manifest ---"
          cat checksums-sha256.txt
          for asset in ${assets}; do
            [ "${asset}" = "checksums-sha256.txt" ] && continue
            gh release download "${TAG}" --repo "${REPO}" --pattern "${asset}" --clobber
            actual="$(sha256sum "${asset}" | cut -d' ' -f1)"
            expected="$(awk -v f="${asset}" '$2 == f {print $1}' checksums-sha256.txt)"
            if [ -z "${expected}" ]; then
              echo "::error::Archive '${asset}' is NOT listed in checksums-sha256.txt — stale/missing manifest entry."
              exit 1
            fi
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::Checksum mismatch for '${asset}': manifest says ${expected}, actual ${actual}."
              exit 1
            fi
            echo "OK ${asset} matches manifest."
          done

      - name: Functional probe on linux-x64 archive
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "${scratch}"' EXIT
          cd "${scratch}"
          gh release download "${TAG}" --repo "${REPO}" --pattern 'semble-linux-x64-fast.tar.gz' --clobber
          tar -xzf semble-linux-x64-fast.tar.gz
          bin="$(find . -type f -name semble | head -n1)"
          if [ -z "${bin}" ]; then
            echo "::error::linux-x64 archive contains no 'semble' executable."
            exit 1
          fi
          chmod +x "${bin}"
          help="$(timeout 10 "${bin}" --help 2>&1 || true)"
          if ! printf '%s' "${help}" | grep -qi 'search'; then
            echo "::error::Binary is a silent-exit-0 stub or unusable: --help does not advertise the 'search' subcommand."
            exit 1
          fi
          version="$(timeout 10 "${bin}" --version 2>&1 || true)"
          echo "Binary OK. --version: ${version:-<empty>}"

      - name: Summary
        if: always()
        run: |
          echo "Immutability violation: ${{ steps.immutability.outputs.violation }}"
          echo "Integrity check: ${{ steps.integrity.conclusion }}"
          echo "Functional probe: ${{ steps.integrity.conclusion == 'success' && 'ran (linux-x64)' || 'n/a' }}"
